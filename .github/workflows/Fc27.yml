name: FC 27 Lite Update Tracker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-fc27:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check FC 27 update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import urllib.request
          import urllib.parse
          import subprocess
          import time
          from datetime import datetime, timezone

          URL = "https://www.ea.com/games/ea-sports-fc/fc-27/news"
          STATE_FILE = "fc27_version.txt"
          LATEST_FILE = "fc27_latest.txt"

          PS5_VERSIONS = {
              "1.0.3": "01.000.006"
          }

          def get_page(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

          def ver(v):
              return tuple(
                  int(x)
                  for x in v.split(".")
              )

          print("Getting EA news page...")

          try:
              page_html = get_page(URL)
          except Exception as e:
              print("EA request failed:", e)
              raise SystemExit(1)

          # Find Title Update versions.
          versions = re.findall(
              r"Title\s+Update\s+v(\d+\.\d+\.\d+)",
              page_html,
              re.IGNORECASE
          )

          if not versions:
              print("No FC 27 Title Update found.")
              raise SystemExit(1)

          game_version = max(
              versions,
              key=ver
          )

          print("Latest FC 27 version:", game_version)

          # PS5 version, when known.
          ps5_version = PS5_VERSIONS.get(
              game_version,
              "نامشخص"
          )

          # This is the date the workflow runs, not the official
          # publication date of the game update.
          notification_date = datetime.now(
              timezone.utc
          ).strftime("%Y-%m-%d")

          print("Workflow date (UTC):", notification_date)

          # Actual PS5 download size is not verified.
          update_size = "نامشخص"

          # Only a version change triggers a notification.
          new_state = game_version
          old_state = ""

          if os.path.exists(STATE_FILE):
              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  old_state = f.read().strip()

          message = (
              "⚽ FC 27 LITE PS5\n\n"
              f"Game Version: {game_version}\n"
              f"PS5 Version: {ps5_version}\n"
              f"Date: {notification_date}\n"
              f"Update Size: {update_size}"
          )

          print("")
          print(message)
          print("")

          # Configure Git.
          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          # Synchronize with the remote repository.
          print("Updating local repository from remote...")

          subprocess.run(
              [
                  "git",
                  "fetch",
                  "origin",
                  "main"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "rebase",
                  "origin/main"
              ],
              check=True
          )

          # Re-read state after synchronization.
          old_state = ""

          if os.path.exists(STATE_FILE):
              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  old_state = f.read().strip()

          # Always refresh the latest information file.
          with open(
              LATEST_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(message)

          def save_and_push(files, commit_message):
              subprocess.run(
                  ["git", "add"] + files,
                  check=True
              )

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              )

              if result.returncode == 0:
                  print("No file changes to commit.")
                  return

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      commit_message
                  ],
                  check=True
              )

              for attempt in range(3):
                  push = subprocess.run(
                      [
                          "git",
                          "push",
                          "origin",
                          "main"
                      ]
                  )

                  if push.returncode == 0:
                      print("Git push succeeded.")
                      return

                  print(
                      f"Push failed. Retry {attempt + 1}/3..."
                  )

                  subprocess.run(
                      [
                          "git",
                          "fetch",
                          "origin",
                          "main"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "rebase",
                          "origin/main"
                      ],
                      check=True
                  )

                  time.sleep(2)

              raise RuntimeError(
                  "Could not push FC 27 changes after 3 attempts."
              )

          # First run: initialize state without notification.
          if not old_state:
              print("First run - saving current version.")

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(new_state)

              save_and_push(
                  [STATE_FILE, LATEST_FILE],
                  "Initialize FC 27 tracker"
              )

              raise SystemExit(0)

          # No new version: update latest information only.
          if old_state == new_state:
              print("No new FC 27 update.")

              save_and_push(
                  [LATEST_FILE],
                  "Update FC 27 latest info"
              )

              raise SystemExit(0)

          # New version detected: send automatic notification.
          print("NEW FC 27 UPDATE DETECTED!")

          bot_token = os.environ.get("BOT_TOKEN")
          chat_id = os.environ.get("CHAT_ID")

          if not bot_token:
              print("BOT_TOKEN secret is missing.")
              raise SystemExit(1)

          if not chat_id:
              print("CHAT_ID secret is missing.")
              raise SystemExit(1)

          telegram_url = (
              "https://api.telegram.org/bot"
              + bot_token
              + "/sendMessage"
          )

          data = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": message
              }
          ).encode()

          telegram_req = urllib.request.Request(
              telegram_url,
              data=data,
              method="POST"
          )

          # Send notification before saving the new state.
          try:
              with urllib.request.urlopen(
                  telegram_req,
                  timeout=30
              ) as response:
                  telegram_result = response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

              print("Telegram:", telegram_result)

              result_json = json.loads(telegram_result)

              if not result_json.get("ok"):
                  raise RuntimeError(
                      "Telegram rejected the notification."
                  )

          except Exception as e:
              print("Telegram notification failed:", e)
              print("State not saved; next run can retry.")
              raise SystemExit(1)

          # Save the new version only after Telegram succeeds.
          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(new_state)

          save_and_push(
              [STATE_FILE, LATEST_FILE],
              "FC 27 update"
          )

          print("FC 27 notification sent successfully.")
          PY
