name: FC 27 Lite Update Tracker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-fc27:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FC 27 update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          cat > check_fc27.py <<'PY'
          import os
          import re
          import urllib.request
          import urllib.parse
          import subprocess

          NEWS_URL = "https://www.ea.com/games/ea-sports-fc/fc-27/news"
          STATE_FILE = "fc27_version.txt"
          LATEST_FILE = "fc27_latest.txt"

          KNOWN_PS5_VERSIONS = {
              "1.0.3": "01.000.006"
          }

          # Get EA news page
          request = urllib.request.Request(
              NEWS_URL,
              headers={
                  "User-Agent": "Mozilla/5.0 PS5-Update-Tracker"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )
          except Exception as e:
              print("EA page error:", e)
              raise SystemExit(1)

          # Find Title Updates
          versions = re.findall(
              r"Title\s+Update\s+v(\d+\.\d+\.\d+)",
              html,
              re.IGNORECASE
          )

          if not versions:
              print("No FC 27 Title Update found.")
              raise SystemExit(1)

          def version_tuple(v):
              return tuple(int(x) for x in v.split("."))

          game_version = max(
              versions,
              key=version_tuple
          )

          print("Latest FC 27 version:", game_version)

          # Find PS5 version
          ps5_version = KNOWN_PS5_VERSIONS.get(
              game_version,
              "نامشخص"
          )

          # Size is intentionally unknown until verified PS5 data exists
          update_size = "نامشخص"

          # Find date
          release_date = "نامشخص"

          date_matches = re.findall(
              r"20\d{2}-\d{2}-\d{2}",
              html
          )

          if date_matches:
              release_date = date_matches[0]

          # State
          new_state = game_version
          old_state = ""

          if os.path.exists(STATE_FILE):
              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  old_state = f.read().strip()

          message = f"""⚽ FC 27 LITE PS5

Game Version: {game_version}
PS5 Version: {ps5_version}
Date: {release_date}
Update Size: {update_size}"""

          print(message)

          # Always keep latest information
          with open(
              LATEST_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(message)

          # First run
          if not old_state:

              print("First run.")
              print("Saving current version without notification.")

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(new_state)

              subprocess.run(
                  ["git", "config", "user.name", "github-actions[bot]"],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(
                  ["git", "add", STATE_FILE, LATEST_FILE],
                  check=True
              )

              result = subprocess.run(
                  ["git", "diff", "--cached", "--quiet"]
              )

              if result.returncode != 0:
                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "Initialize FC 27 tracker"
                      ],
                      check=True
                  )

                  subprocess.run(
                      ["git", "push"],
                      check=True
                  )

              raise SystemExit(0)

          # No new update
          if old_state == new_state:

              print(
                  "No new FC 27 update."
              )

              subprocess.run(
                  ["git", "config", "user.name", "github-actions[bot]"],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(
                  ["git", "add", LATEST_FILE],
                  check=True
              )

              result = subprocess.run(
                  ["git", "diff", "--cached", "--quiet"]
              )

              if result.returncode != 0:
                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "Update FC 27 latest info"
                      ],
                      check=True
                  )

                  subprocess.run(
                      ["git", "push"],
                      check=True
                  )

              raise SystemExit(0)

          # New update
          print("NEW FC 27 UPDATE DETECTED!")

          bot_token = os.environ.get("BOT_TOKEN")
          chat_id = os.environ.get("CHAT_ID")

          if not bot_token:
              print("BOT_TOKEN secret is missing.")
              raise SystemExit(1)

          if not chat_id:
              print("CHAT_ID secret is missing.")
              raise SystemExit(1)

          telegram_url = (
              "https://api.telegram.org/bot"
              + bot_token
              + "/sendMessage"
          )

          data = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": message
              }
          ).encode()

          telegram_request = urllib.request.Request(
              telegram_url,
              data=data,
              method="POST",
              headers={
                  "Content-Type":
                  "application/x-www-form-urlencoded"
              }
          )

          # Send Telegram notification
          try:
              with urllib.request.urlopen(
                  telegram_request,
                  timeout=30
              ) as response:

                  telegram_response = response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

              print(
                  "Telegram:",
                  telegram_response
              )

              if '"ok":true' not in telegram_response:
                  print("Telegram failed.")
                  raise SystemExit(1)

          except Exception as e:
              print(
                  "Telegram notification failed:",
                  e
              )

              print(
                  "State will NOT be updated."
              )

              raise SystemExit(1)

          # Telegram succeeded -> save state
          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(new_state)

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", STATE_FILE, LATEST_FILE],
              check=True
          )

          result = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if result.returncode != 0:
              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      f"FC 27 update {game_version}"
                  ],
                  check=True
              )

              subprocess.run(
                  ["git", "push"],
                  check=True
              )

          print(
              "FC 27 notification sent successfully."
          )
          PY

          python3 check_fc27.py
