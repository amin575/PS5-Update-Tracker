name: FC 27 Lite Update Tracker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-fc27:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FC 27 update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import urllib.request
          import urllib.parse
          import subprocess

          URL = "https://www.ea.com/games/ea-sports-fc/fc-27/news"
          STATE_FILE = "fc27_version.txt"
          LATEST_FILE = "fc27_latest.txt"

          PS5_VERSIONS = {
              "1.0.3": "01.000.006"
          }

          # Get EA page
          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          try:
              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:
                  html = response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )
          except Exception as e:
              print("EA request failed:", e)
              raise SystemExit(1)

          # Find Title Update versions
          versions = re.findall(
              r"Title\s+Update\s+v(\d+\.\d+\.\d+)",
              html,
              re.IGNORECASE
          )

          if not versions:
              print("No FC 27 update found.")
              raise SystemExit(1)

          def ver(v):
              return tuple(
                  int(x)
                  for x in v.split(".")
              )

          game_version = max(
              versions,
              key=ver
          )

          print(
              "Latest FC 27 version:",
              game_version
          )

          # PS5 version
          ps5_version = PS5_VERSIONS.get(
              game_version,
              "نامشخص"
          )

          # Date
          dates = re.findall(
              r"20\d{2}-\d{2}-\d{2}",
              html
          )

          release_date = (
              dates[0]
              if dates
              else "نامشخص"
          )

          # Size
          # Real PS5 download size is not verified yet.
          update_size = "نامشخص"

          # State
          new_state = game_version
          old_state = ""

          if os.path.exists(STATE_FILE):
              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  old_state = f.read().strip()

          # Message
          message = (
              "⚽ FC 27 LITE PS5\n\n"
              f"Game Version: {game_version}\n"
              f"PS5 Version: {ps5_version}\n"
              f"Date: {release_date}\n"
              f"Update Size: {update_size}"
          )

          print("")
          print(message)
          print("")

          # Save latest information
          with open(
              LATEST_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(message)

          # First run
          if not old_state:

              print(
                  "First run - saving current version."
              )

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(new_state)

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      STATE_FILE,
                      LATEST_FILE
                  ],
                  check=True
              )

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              )

              if result.returncode != 0:
                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "Initialize FC 27 tracker"
                      ],
                      check=True
                  )

                  subprocess.run(
                      ["git", "push"],
                      check=True
                  )

              raise SystemExit(0)

          # No new update
          if old_state == new_state:

              print(
                  "No new FC 27 update."
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      LATEST_FILE
                  ],
                  check=True
              )

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              )

              if result.returncode != 0:
                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "Update FC 27 latest info"
                      ],
                      check=True
                  )

                  subprocess.run(
                      ["git", "push"],
                      check=True
                  )

              raise SystemExit(0)

          # New update detected
          print(
              "NEW FC 27 UPDATE DETECTED!"
          )

          bot_token = os.environ.get(
              "BOT_TOKEN"
          )

          chat_id = os.environ.get(
              "CHAT_ID"
          )

          if not bot_token:
              print(
                  "BOT_TOKEN secret is missing."
              )
              raise SystemExit(1)

          if not chat_id:
              print(
                  "CHAT_ID secret is missing."
              )
              raise SystemExit(1)

          telegram_url = (
              "https://api.telegram.org/bot"
              + bot_token
              + "/sendMessage"
          )

          data = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": message
              }
          ).encode()

          telegram_req = urllib.request.Request(
              telegram_url,
              data=data,
              method="POST"
          )

          # Send notification
          try:
              with urllib.request.urlopen(
                  telegram_req,
                  timeout=30
              ) as response:
                  result = response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

              print(
                  "Telegram:",
                  result
              )

              if '"ok":true' not in result:
                  print(
                      "Telegram notification failed."
                  )
                  raise SystemExit(1)

          except Exception as e:
              print(
                  "Telegram error:",
                  e
              )

              # Do not save state.
              # Next run will retry.
              raise SystemExit(1)

          # Telegram succeeded
          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(new_state)

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "add",
                  STATE_FILE,
                  LATEST_FILE
              ],
              check=True
          )

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--cached",
                  "--quiet"
              ]
          )

          if result.returncode != 0:
              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "FC 27 update"
                  ],
                  check=True
              )

              subprocess.run(
                  ["git", "push"],
                  check=True
              )

          print(
              "FC 27 notification sent successfully."
          )
