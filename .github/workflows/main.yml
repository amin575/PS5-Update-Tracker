name: PS5 System Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PS5 System Update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import requests
          import xml.etree.ElementTree as ET
          import os
          import re
          from pathlib import Path

          URL = "http://fus01.ps5.update.playstation.net/update/ps5/official/tJMRE80IbXnE9YuG0jzTXgKEjIMoabr6/list/us/updatelist.xml"

          print("Getting Sony XML...")

          r = requests.get(URL, timeout=30)
          r.raise_for_status()

          root = ET.fromstring(r.content)

          system = root.find(".//system_pup")

          if system is None:
              raise Exception("PS5 system update not found")

          version = system.attrib["label"]

          image = system.find(".//image")

          if image is None:
              raise Exception("Update image not found")

          size = int(image.attrib["size"])
          size_gb = size / 1024 / 1024 / 1024

          image_url = (image.text or "").strip()

          date_match = re.search(
              r"/image/(\d{4})_(\d{4})/",
              image_url
          )

          if date_match:
              year = date_match.group(1)
              month_day = date_match.group(2)

              release_date = (
                  year
                  + "-"
                  + month_day[:2]
                  + "-"
                  + month_day[2:]
              )
          else:
              release_date = "Unknown"

          print("Current version:", version)
          print("Release date:", release_date)
          print("Update size:", f"{size_gb:.2f} GB")

          state_file = Path("ps5_system_version.txt")
          latest_file = Path("ps5_latest.txt")

          old_version = ""

          if state_file.exists():
              old_version = state_file.read_text().strip()

          print("Previous version:", old_version or "NONE")

          latest_text = (
              "🟦 PS5 SYSTEM SOFTWARE\n\n"
              "Version: " + version + "\n"
              "Release Date: " + release_date + "\n"
              "Size: " + f"{size_gb:.2f}" + " GB\n"
          )

          latest_file.write_text(
              latest_text,
              encoding="utf-8"
          )

          # First run: save current version without sending notification
          if not old_version:
              state_file.write_text(version)

              print("First run.")
              print("Current version saved.")
              print("No Telegram notification sent.")

          # New version detected
          elif old_version != version:

              BOT_TOKEN = os.environ["BOT_TOKEN"]
              CHAT_ID = os.environ["CHAT_ID"]

              message = (
                  "🟦 PS5 SYSTEM SOFTWARE UPDATE\n\n"
                  "Version: " + version + "\n"
                  "Release Date: " + release_date + "\n"
                  "Size: " + f"{size_gb:.2f}" + " GB\n\n"
                  "🆕 New system update released"
              )

              tg = requests.post(
                  "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage",
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=30
              )

              print("Telegram HTTP:", tg.status_code)
              print("Telegram response:", tg.text)

              tg.raise_for_status()

              state_file.write_text(version)

              print("New version saved.")
              print("Notification sent.")

          # Same version
          else:
              print("No new update.")
          PY

      - name: Save state
        run: |
          git config user.name "PS5 Update Tracker"
          git config user.email "actions@github.com"

          git add ps5_system_version.txt ps5_latest.txt

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update PS5 firmware state"
            git push
          fi
