name: PS5 System Update Tracker

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check PS5 firmware
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import requests
          import xml.etree.ElementTree as ET
          import os

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          url = "http://fus01.ps5.update.playstation.net/update/ps5/official/tJMRE80IbXnE9YuG0jzTXgKEjIMoabr6/list/us/updatelist.xml"

          r = requests.get(url, timeout=20)
          r.raise_for_status()

          root = ET.fromstring(r.text)

          # پیدا کردن آخرین Firmware
          systems = root.findall(".//system_pup")

          if not systems:
              raise Exception("No PS5 firmware found in XML")

          system = systems[-1]

          version = system.attrib.get("label", "Unknown")

          image = system.find(".//image")

          if image is None:
              raise Exception("Firmware image not found")

          size = int(image.attrib.get("size", "0"))
          size_gb = size / 1024 / 1024 / 1024

          message = (
              "🟦 PS5 SYSTEM SOFTWARE\n\n"
              f"Version: {version}\n"
              f"Size: {size_gb:.2f} GB"
          )

          response = requests.post(
              f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage",
              data={
                  "chat_id": CHAT_ID,
                  "text": message
              },
              timeout=20
          )

          response.raise_for_status()

          print(message)
          PY
