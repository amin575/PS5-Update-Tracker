name: Save Update Details

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch update details
        run: |
          python - <<'PY'
          import requests
          import json
          import xml.etree.ElementTree as ET
          import re
          import html as html_lib
          import urllib3

          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )

          HEADERS = {
              "User-Agent": "Mozilla/5.0"
          }

          # =========================================================
          # PS5 SYSTEM SOFTWARE
          # =========================================================

          print("⚙️ Checking PS5 System Software")

          ps5_url = (
              "https://fus01.ps5.update.playstation.net/"
              "update/ps5/official/"
              "tJMRE80IbXnE9YuG0jzTXgKEjIMoabr6/"
              "list/us/updatelist.xml"
          )

          r = requests.get(
              ps5_url,
              headers=HEADERS,
              timeout=30,
              verify=False
          )

          print("PS5 HTTP:", r.status_code)

          root = ET.fromstring(r.text)

          system_pup = root.find(".//system_pup")

          if system_pup is None:
              raise Exception("PS5 system_pup not found")

          ps5_version = system_pup.attrib.get(
              "label",
              "Unknown"
          )

          ps5_short = system_pup.attrib.get(
              "upd_version",
              "Unknown"
          )

          image = system_pup.find(".//image")

          if image is not None:
              ps5_bytes = int(
                  image.attrib.get("size", "0")
              )
          else:
              ps5_bytes = 0

          ps5_gb = ps5_bytes / (1024 ** 3)

          print("PS5 Version:", ps5_version)
          print("PS5 Short Version:", ps5_short)
          print("PS5 Size:", f"{ps5_gb:.2f} GB")

          ps5_text = (
              f"Version: {ps5_version}\n"
              f"Short Version: {ps5_short}\n"
              f"Size: {ps5_gb:.2f} GB\n"
              f"Size Bytes: {ps5_bytes}"
          )

          with open(
              "ps5_latest.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(ps5_text)


          # =========================================================
          # WARZONE
          # =========================================================

          print("")
          print("⚙️ Checking Warzone")

          BASE = "https://prosperopatches.com"
          PAGE = BASE + "/PPSA07950"
          API = BASE + "/api/internal/loadpatches"

          TITLE_ID = "PPSA07950"

          KEY = (
              "db36a93c8bdfcc99c6c0170671c3b49d75a9873eb3c634"
              "fde0ab26392353a299"
          )

          session = requests.Session()

          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          page = session.get(
              PAGE,
              timeout=30,
              verify=False
          )

          print("Warzone page HTTP:", page.status_code)

          payload = {
              "titleid": TITLE_ID,
              "key": KEY
          }

          response = session.post(
              API,
              data=json.dumps(payload),
              timeout=30,
              verify=False,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Content-Type":
                      "application/x-www-form-urlencoded; charset=UTF-8",
                  "Accept": "application/json",
                  "Referer": PAGE,
                  "Origin": BASE,
                  "X-Requested-With": "XMLHttpRequest"
              }
          )

          print("Warzone API HTTP:", response.status_code)

          data = response.json()

          patches = data.get("patches", [])

          if not patches:
              raise Exception("Warzone patches not found")

          latest = patches[0]

          warzone_version = latest.get(
              "content_ver",
              "Unknown"
          )

          warzone_size = latest.get(
              "filesize",
              "Unknown"
          )

          warzone_firmware = latest.get(
              "required_firmware",
              "Unknown"
          )

          warzone_date = latest.get(
              "import_date",
              "Unknown"
          )

          last_updated = data.get(
              "lastupdated",
              "Unknown"
          )

          print("Warzone Version:", warzone_version)
          print("Warzone Size:", warzone_size)
          print("Required Firmware:", warzone_firmware)
          print("Import Date:", warzone_date)

          warzone_text = (
              f"Version: {warzone_version}\n"
              f"Size: {warzone_size}\n"
              f"Required Firmware: {warzone_firmware}\n"
              f"Import Date: {warzone_date}\n"
              f"Source Updated: {last_updated}"
          )

          with open(
              "warzone_latest.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(warzone_text)


          # =========================================================
          # FORTNITE
          # =========================================================

          print("")
          print("⚙️ Checking Fortnite")

          fortnite_url = (
              "https://framepatch.app/games/fortnite"
          )

          r = requests.get(
              fortnite_url,
              headers=HEADERS,
              timeout=30,
              verify=False
          )

          print("Fortnite HTTP:", r.status_code)

          page_text = html_lib.unescape(r.text)

          # حذف تگ‌های HTML
          page_text = re.sub(
              r"<[^>]+>",
              " ",
              page_text
          )

          page_text = re.sub(
              r"\s+",
              " ",
              page_text
          )

          # Patch 01.000.228 · 74.2 GB
          matches = re.findall(
              r"Patch\s+"
              r"([0-9]+\.[0-9]+\.[0-9]+)"
              r"\s*(?:·|•|-|&middot;)"
              r"\s*"
              r"([0-9]+(?:\.[0-9]+)?)\s*GB",
              page_text,
              re.IGNORECASE
          )

          if not matches:

              matches = re.findall(
                  r"Patch\s+"
                  r"([0-9]+\.[0-9]+\.[0-9]+)"
                  r"[^0-9]{0,50}"
                  r"([0-9]+(?:\.[0-9]+)?)\s*GB",
                  page_text,
                  re.IGNORECASE
              )

          if matches:

              fortnite_version = matches[0][0]
              fortnite_size = matches[0][1] + " GB"

          else:

              version_match = re.search(
                  r"Patch\s+"
                  r"([0-9]+\.[0-9]+\.[0-9]+)",
                  page_text,
                  re.IGNORECASE
              )

              size_match = re.search(
                  r"([0-9]+(?:\.[0-9]+)?)\s*GB",
                  page_text,
                  re.IGNORECASE
              )

              fortnite_version = (
                  version_match.group(1)
                  if version_match
                  else "Unknown"
              )

              fortnite_size = (
                  size_match.group(1) + " GB"
                  if size_match
                  else "Unknown"
              )

          print("Fortnite Version:", fortnite_version)
          print("Fortnite Size:", fortnite_size)

          fortnite_text = (
              f"Version: {fortnite_version}\n"
              f"Size: {fortnite_size}"
          )

          with open(
              "fortnite_latest.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(fortnite_text)

          print("")
          print("✅ All update details saved")


      # =========================================================
      # SAVE FILES TO GITHUB
      # =========================================================

      - name: Save update details to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ps5_latest.txt
          git add warzone_latest.txt
          git add fortnite_latest.txt

          if git diff --cached --quiet; then
            echo "No repository changes"
            exit 0
          fi

          git commit -m "Update latest PS5 update details"

          git pull --rebase origin main

          git push origin main

          echo "✅ Update details saved successfully"
