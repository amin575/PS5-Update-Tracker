name: Telegram Bot Commands

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process Telegram commands
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import requests
          import os
          import subprocess

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          API = f"https://api.telegram.org/bot{BOT_TOKEN}"

          def telegram(method, data=None):
              try:
                  r = requests.post(
                      f"{API}/{method}",
                      json=data or {},
                      timeout=30
                  )

                  print(f"{method}: HTTP {r.status_code}")

                  return r.json()

              except Exception as e:
                  print(f"Telegram error: {e}")
                  return {}

          # حذف webhook
          telegram(
              "deleteWebhook",
              {
                  "drop_pending_updates": False
              }
          )

          # خواندن offset قبلی
          offset_file = "telegram_offset.txt"
          offset = None

          if os.path.exists(offset_file):
              try:
                  with open(
                      offset_file,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      offset = int(f.read().strip())
              except:
                  offset = None

          params = {
              "limit": 100,
              "timeout": 0
          }

          if offset is not None:
              params["offset"] = offset

          try:
              response = requests.get(
                  f"{API}/getUpdates",
                  params=params,
                  timeout=30
              )

              data = response.json()

          except Exception as e:
              print("getUpdates error:", e)
              raise SystemExit(0)

          if not data.get("ok"):
              print("getUpdates failed:")
              print(data)
              raise SystemExit(0)

          updates = data.get("result", [])

          if not updates:
              print("No new Telegram messages")
              raise SystemExit(0)

          print(f"Received {len(updates)} update(s)")

          latest_offset = None

          for update in updates:

              update_id = update.get("update_id")

              if update_id is not None:
                  latest_offset = update_id + 1

              message = update.get("message", {})

              text = message.get(
                  "text",
                  ""
              ).strip()

              if not text:
                  continue

              print("Telegram message:", text)

              # فقط دستور /updates
              command = text.split()[0].lower()

              if command != "/updates":
                  continue

              print("Processing /updates")

              # =====================================================
              # PS5
              # =====================================================

              if os.path.exists("ps5_latest.txt"):

                  with open(
                      "ps5_latest.txt",
                      "r",
                      encoding="utf-8"
                  ) as f:
                      ps5 = f.read().strip()

              else:

                  ps5 = (
                      "اطلاعات آپدیت PS5 هنوز ذخیره نشده."
                  )

              telegram(
                  "sendMessage",
                  {
                      "chat_id": CHAT_ID,
                      "text": (
                          "🎮 PS5 SYSTEM SOFTWARE\n\n"
                          + ps5
                      )
                  }
              )

              # =====================================================
              # WARZONE
              # =====================================================

              if os.path.exists("warzone_latest.txt"):

                  with open(
                      "warzone_latest.txt",
                      "r",
                      encoding="utf-8"
                  ) as f:
                      warzone = f.read().strip()

              else:

                  warzone = (
                      "اطلاعات آپدیت Warzone هنوز ذخیره نشده."
                  )

              telegram(
                  "sendMessage",
                  {
                      "chat_id": CHAT_ID,
                      "text": (
                          "🎮 WARZONE PS5\n\n"
                          + warzone
                      )
                  }
              )

              # =====================================================
              # FORTNITE
              # =====================================================

              if os.path.exists("fortnite_latest.txt"):

                  with open(
                      "fortnite_latest.txt",
                      "r",
                      encoding="utf-8"
                  ) as f:
                      fortnite = f.read().strip()

              else:

                  fortnite = (
                      "اطلاعات آپدیت Fortnite هنوز ذخیره نشده."
                  )

              telegram(
                  "sendMessage",
                  {
                      "chat_id": CHAT_ID,
                      "text": (
                          "🎮 FORTNITE PS5\n\n"
                          + fortnite
                      )
                  }
              )

              print("✅ /updates sent")

          # =========================================================
          # ذخیره offset
          # =========================================================

          if latest_offset is not None:

              with open(
                  offset_file,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(str(latest_offset))

          # =========================================================
          # Commit offset
          # =========================================================

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "add",
                  "telegram_offset.txt"
              ],
              check=True
          )

          check = subprocess.run(
              [
                  "git",
                  "diff",
                  "--cached",
                  "--quiet"
              ]
          )

          if check.returncode != 0:

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update Telegram offset"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "pull",
                      "--rebase",
                      "origin",
                      "main"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "push",
                      "origin",
                      "main"
                  ],
                  check=True

              )

          print("Telegram bot finished")
          PY
