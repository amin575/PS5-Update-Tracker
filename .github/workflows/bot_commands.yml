name: Telegram Bot Commands

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Telegram commands
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import requests
          import os
          import time
          import subprocess

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = str(os.environ["CHAT_ID"])

          API = f"https://api.telegram.org/bot{BOT_TOKEN}"

          print("🤖 Telegram command checker started")

          # --------------------------------------------------
          # Remove webhook so getUpdates can work
          # --------------------------------------------------

          webhook = requests.post(
              API + "/deleteWebhook",
              data={
                  "drop_pending_updates": False
              },
              timeout=20
          )

          print("Delete webhook HTTP:", webhook.status_code)

          if webhook.status_code != 200:
              print(webhook.text)
              raise SystemExit(1)

          # --------------------------------------------------
          # Read last processed Telegram update
          # --------------------------------------------------

          OFFSET_FILE = "telegram_offset.txt"

          last_offset = 0

          if os.path.exists(OFFSET_FILE):

              with open(
                  OFFSET_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  value = f.read().strip()

                  if value.isdigit():
                      last_offset = int(value)

          print("Last offset:", last_offset)

          # --------------------------------------------------
          # Get Telegram messages
          # --------------------------------------------------

          response = requests.get(
              API + "/getUpdates",
              params={
                  "offset": last_offset + 1,
                  "timeout": 10,
                  "allowed_updates": '["message"]'
              },
              timeout=20
          )

          print("Telegram HTTP:", response.status_code)

          if response.status_code != 200:
              print(response.text)
              raise SystemExit(1)

          data = response.json()

          if not data.get("ok"):
              print(data)
              raise SystemExit(1)

          updates = data.get("result", [])

          print("Telegram updates:", len(updates))

          newest_update_id = last_offset

          # --------------------------------------------------
          # Read saved versions
          # --------------------------------------------------

          def read_file(filename):

              if not os.path.exists(filename):
                  return None

              with open(
                  filename,
                  "r",
                  encoding="utf-8"
              ) as f:

                  return f.read().strip()

          ps5_version = read_file(
              "ps5_system_version.txt"
          )

          warzone_version = read_file(
              "warzone_version.txt"
          )

          fortnite_version = read_file(
              "fortnite_version.txt"
          )

          print("PS5:", ps5_version)
          print("Warzone:", warzone_version)
          print("Fortnite:", fortnite_version)

          # --------------------------------------------------
          # Process messages
          # --------------------------------------------------

          for update in updates:

              update_id = update.get("update_id", 0)

              if update_id > newest_update_id:
                  newest_update_id = update_id

              message = update.get("message", {})

              text = message.get("text", "")

              chat_id = str(
                  message.get("chat", {}).get("id", "")
              )

              if not text:
                  continue

              if chat_id != CHAT_ID:
                  print("Ignoring another chat")
                  continue

              command = text.strip().split()[0].lower()

              if command != "/updates":
                  continue

              print("📥 /updates received")

              # ------------------------------------------------
              # PS5
              # ------------------------------------------------

              if ps5_version:

                  ps5_message = f"""⚙️ PS5 SYSTEM SOFTWARE

          Version: {ps5_version}"""

              else:

                  ps5_message = """⚙️ PS5 SYSTEM SOFTWARE

          ❌ اطلاعات نسخه موجود نیست"""

              # ------------------------------------------------
              # Warzone
              # ------------------------------------------------

              if warzone_version:

                  warzone_message = f"""🔫 CALL OF DUTY: WARZONE

          Version: {warzone_version}"""

              else:

                  warzone_message = """🔫 CALL OF DUTY: WARZONE

          ❌ اطلاعات نسخه موجود نیست"""

              # ------------------------------------------------
              # Fortnite
              # ------------------------------------------------

              if fortnite_version:

                  fortnite_message = f"""🟣 FORTNITE

          Version: {fortnite_version}"""

              else:

                  fortnite_message = """🟣 FORTNITE

          ❌ اطلاعات نسخه موجود نیست"""

              # ------------------------------------------------
              # Send 3 separate messages
              # ------------------------------------------------

              for msg in [
                  ps5_message,
                  warzone_message,
                  fortnite_message
              ]:

                  send = requests.post(
                      API + "/sendMessage",
                      data={
                          "chat_id": CHAT_ID,
                          "text": msg
                      },
                      timeout=20
                  )

                  print(
                      "Send HTTP:",
                      send.status_code
                  )

                  if send.status_code != 200:
                      print(send.text)

                  time.sleep(0.5)

              print("✅ 3 messages sent")

          # --------------------------------------------------
          # Save Telegram offset
          # --------------------------------------------------

          if newest_update_id > last_offset:

              with open(
                  OFFSET_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(str(newest_update_id))

              print(
                  "Saved new offset:",
                  newest_update_id
              )

          else:

              print("No new Telegram updates")

          # --------------------------------------------------
          # Commit offset
          # --------------------------------------------------

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", OFFSET_FILE],
              check=True
          )

          result = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if result.returncode != 0:

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update Telegram offset"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "pull",
                      "--rebase",
                      "origin",
                      "main"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "push",
                      "origin",
                      "main"
                  ],
                  check=True
              )

              print("Telegram offset saved")

          else:

              print("No repository changes")

          print("🤖 Telegram command checker finished")
          PY
