name: Telegram Bot Commands

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-bot-commands
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process Telegram commands
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import requests
          import os
          import subprocess

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          API = f"https://api.telegram.org/bot{BOT_TOKEN}"

          def tg(method, data=None):
              r = requests.post(
                  f"{API}/{method}",
                  json=data or {},
                  timeout=30
              )

              print(method, r.status_code)

              try:
                  return r.json()
              except:
                  return {}

          # ---------------------------------------------------------
          # Webhook باید خاموش باشد تا getUpdates کار کند
          # ---------------------------------------------------------

          tg(
              "deleteWebhook",
              {
                  "drop_pending_updates": False
              }
          )

          offset_file = "telegram_offset.txt"

          # ---------------------------------------------------------
          # دریافت offset قبلی
          # ---------------------------------------------------------

          offset_exists = os.path.exists(offset_file)
          offset = None

          if offset_exists:
              try:
                  with open(
                      offset_file,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      value = f.read().strip()

                  if value:
                      offset = int(value)

              except Exception:
                  offset = None

          # ---------------------------------------------------------
          # دریافت پیام‌های جدید
          # ---------------------------------------------------------

          params = {
              "limit": 100,
              "timeout": 0
          }

          if offset is not None:
              params["offset"] = offset

          response = requests.get(
              f"{API}/getUpdates",
              params=params,
              timeout=30
          )

          data = response.json()

          if not data.get("ok"):
              print("getUpdates failed:")
              print(data)
              raise SystemExit(0)

          updates = data.get("result", [])

          print("Updates received:", len(updates))

          # ---------------------------------------------------------
          # اگر اولین اجرای سیستم است:
          # پیام‌های قدیمی را مصرف کن ولی جواب نده
          # ---------------------------------------------------------

          if not offset_exists:

              if updates:

                  newest_offset = (
                      max(
                          u["update_id"]
                          for u in updates
                      ) + 1
                  )

                  with open(
                      offset_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(str(newest_offset))

                  print(
                      "First run detected."
                  )

                  print(
                      "Old Telegram messages ignored."
                  )

              else:

                  print(
                      "First run: no Telegram messages."
                  )

              # ذخیره offset
              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      "telegram_offset.txt"
                  ],
                  check=True
              )

              check = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              )

              if check.returncode != 0:

                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "Initialize Telegram offset"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "pull",
                          "--rebase",
                          "origin",
                          "main"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "push",
                          "origin",
                          "main"
                      ],
                      check=True
                  )

              print("Telegram bot initialized.")
              raise SystemExit(0)


          # ---------------------------------------------------------
          # هیچ پیام جدیدی نیست
          # ---------------------------------------------------------

          if not updates:

              print(
                  "No new Telegram messages."
              )

              raise SystemExit(0)


          # ---------------------------------------------------------
          # آخرین offset
          # ---------------------------------------------------------

          newest_offset = (
              max(
                  u["update_id"]
                  for u in updates
              ) + 1
          )


          # ---------------------------------------------------------
          # فقط جدیدترین /updates را پیدا کن
          # ---------------------------------------------------------

          command_found = False

          for update in updates:

              message = update.get(
                  "message",
                  {}
              )

              text = (
                  message.get(
                      "text",
                      ""
                  )
                  .strip()
              )

              if not text:
                  continue

              print(
                  "Telegram message:",
                  text
              )

              command = (
                  text.split()[0]
                  .lower()
              )

              if command == "/updates":

                  command_found = True

          # ---------------------------------------------------------
          # اگر /updates وجود داشت، فقط یک بار پاسخ بده
          # ---------------------------------------------------------

          if command_found:

              print(
                  "New /updates command found."
              )

              # -----------------------------------------------------
              # PS5
              # -----------------------------------------------------

              if os.path.exists(
                  "ps5_latest.txt"
              ):

                  with open(
                      "ps5_latest.txt",
                      "r",
                      encoding="utf-8"
                  ) as f:
                      ps5 = f.read().strip()

              else:

                  ps5 = (
                      "اطلاعات آپدیت PS5 هنوز "
                      "ذخیره نشده."
                  )

              tg(
                  "sendMessage",
                  {
                      "chat_id": CHAT_ID,
                      "text":
                          "🎮 PS5 SYSTEM SOFTWARE\n\n"
                          + ps5
                  }
              )


              # -----------------------------------------------------
              # WARZONE
              # -----------------------------------------------------

              if os.path.exists(
                  "warzone_latest.txt"
              ):

                  with open(
                      "warzone_latest.txt",
                      "r",
                      encoding="utf-8"
                  ) as f:
                      warzone = f.read().strip()

              else:

                  warzone = (
                      "اطلاعات آپدیت Warzone هنوز "
                      "ذخیره نشده."
                  )

              tg(
                  "sendMessage",
                  {
                      "chat_id": CHAT_ID,
                      "text":
                          "🎮 WARZONE PS5\n\n"
                          + warzone
                  }
              )


              # -----------------------------------------------------
              # FORTNITE
              # -----------------------------------------------------

              if os.path.exists(
                  "fortnite_latest.txt"
              ):

                  with open(
                      "fortnite_latest.txt",
                      "r",
                      encoding="utf-8"
                  ) as f:
                      fortnite = f.read().strip()

              else:

                  fortnite = (
                      "اطلاعات آپدیت Fortnite هنوز "
                      "ذخیره نشده."
                  )

              tg(
                  "sendMessage",
                  {
                      "chat_id": CHAT_ID,
                      "text":
                          "🎮 FORTNITE PS5\n\n"
                          + fortnite
                  }
              )

              print(
                  "✅ /updates response sent once."
              )

          else:

              print(
                  "No /updates command."
              )


          # ---------------------------------------------------------
          # همیشه پیام‌های دریافت‌شده را مصرف کن
          # ---------------------------------------------------------

          with open(
              offset_file,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  str(newest_offset)
              )


          # ---------------------------------------------------------
          # ذخیره offset در GitHub
          # ---------------------------------------------------------

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "add",
                  "telegram_offset.txt"
              ],
              check=True
          )

          check = subprocess.run(
              [
                  "git",
                  "diff",
                  "--cached",
                  "--quiet"
              ]
          )

          if check.returncode != 0:

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update Telegram offset"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "pull",
                      "--rebase",
                      "origin",
                      "main"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "push",
                      "origin",
                      "main"
                  ],
                  check=True
              )

          print("Telegram bot finished.")
          PY
