name: Telegram Bot Commands Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Telegram connection
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import requests
          import os

          token = os.environ.get("BOT_TOKEN", "")

          print("Token exists:", bool(token))
          print("Token length:", len(token))

          if not token:
              print("❌ BOT_TOKEN is empty")
              raise SystemExit(1)

          url = f"https://api.telegram.org/bot{token}/getMe"

          response = requests.get(
              url,
              timeout=20
          )

          print("Telegram HTTP:", response.status_code)

          if response.status_code != 200:
              print("❌ Telegram connection failed")
              print(response.text)
              raise SystemExit(1)

          data = response.json()

          if not data.get("ok"):
              print("❌ Telegram returned failure")
              print(data)
              raise SystemExit(1)

          bot = data["result"]

          print("✅ Telegram connection works")
          print("Bot username:", bot.get("username"))
          print("Bot name:", bot.get("first_name"))
          PY
