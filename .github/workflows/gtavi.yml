name: GTA VI PS5 Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  gtavi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GTA VI
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 - <<'PY'
          import requests
          import re
          import json
          import os
          import subprocess

          TITLE_ID = "PPSA01547"
          BASE = "https://prosperopatches.com"
          PAGE_URL = f"{BASE}/{TITLE_ID}"

          STATE_FILE = "gtavi_latest.txt"

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          }

          print("=" * 70)
          print("GTA VI PS5 TRACKER")
          print("Title ID:", TITLE_ID)
          print("=" * 70)

          r = requests.get(
              PAGE_URL,
              headers=headers,
              timeout=30
          )

          print("PAGE HTTP:", r.status_code)
          print("PAGE SIZE:", len(r.text))

          if r.status_code != 200:
              print("Failed to fetch Prospero page")
              raise SystemExit(1)

          html = r.text

          # --------------------------------------------------
          # NO GTA VI DATA YET
          # --------------------------------------------------

          if "dynpatch" not in html.lower():

              print()
              print("GTA VI is not indexed by Prospero yet.")
              print("No dynpatch container was found.")
              print("Tracker will keep checking automatically.")

              previous = ""

              if os.path.exists(STATE_FILE):
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      previous = f.read().strip()

              initial_state = """GTA VI PS5
          Status: هنوز اطلاعاتی در Prospero ثبت نشده.
          Tracker: Active"""

              # فقط اگر فایل هنوز وجود نداشته باشد،
              # وضعیت اولیه را ثبت و یک نوتیف ارسال کن.
              if not previous:

                  print()
                  print("Creating initial GTA VI state...")

                  message = """🎮 PS5 UPDATE

          GTA VI

          ⏳ هنوز اطلاعاتی در Prospero ثبت نشده.

          Tracker فعال است و به‌صورت خودکار بررسی می‌کند."""

                  telegram_url = f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage"

                  response = requests.post(
                      telegram_url,
                      data={
                          "chat_id": os.environ["CHAT_ID"],
                          "text": message
                      },
                      timeout=30
                  )

                  print("Telegram HTTP:", response.status_code)

                  if response.status_code != 200:
                      print("Telegram notification failed")
                      print(response.text)
                      raise SystemExit(1)

                  print("Initial Telegram notification sent")

                  with open(STATE_FILE, "w", encoding="utf-8") as f:
                      f.write(initial_state + "\n")

              else:
                  print()
                  print("Initial GTA VI state already exists.")
                  print("No repeated notification.")

              raise SystemExit(0)

          # --------------------------------------------------
          # GTA VI DATA FOUND
          # --------------------------------------------------

          print()
          print("GTA VI patch container FOUND.")
          print()

          titleid = None
          key = None

          match = re.search(
              r'data-titleid="([^"]+)"\s+data-key="([0-9a-f]+)"',
              html,
              re.I
          )

          if match:
              titleid = match.group(1)
              key = match.group(2)

          if not key:
              match = re.search(
                  r'id="dynpatch"[^>]*data-loadparams="([^"]+)"',
                  html,
                  re.I
              )

              if match:
                  packed = match.group(1)

                  m_title = re.search(
                      r'["\']titleid["\']\s*:\s*["\']([A-Z0-9]+)["\']',
                      packed,
                      re.I
                  )

                  m_key = re.search(
                      r'["\']key["\']\s*:\s*["\']([0-9a-f]+)["\']',
                      packed,
                      re.I
                  )

                  if m_title:
                      titleid = m_title.group(1)

                  if m_key:
                      key = m_key.group(1)

          print("TITLE ID:", titleid)
          print("KEY FOUND:", bool(key))

          if not key:
              print()
              print("ERROR: dynpatch exists but no per-title key was found.")
              print("Prospero markup may have changed.")
              raise SystemExit(1)

          api_url = f"{BASE}/api/internal/loadpatches"

          payload = {
              "titleid": titleid or TITLE_ID,
              "key": key
          }

          api_headers = {
              "User-Agent": "Mozilla/5.0",
              "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
              "Accept": "application/json",
              "Referer": PAGE_URL
          }

          p = requests.post(
              api_url,
              headers=api_headers,
              data=json.dumps(payload),
              timeout=30
          )

          print()
          print("LOADPATCHES HTTP:", p.status_code)

          if not p.ok:
              print(p.text[:10000])
              raise SystemExit(1)

          try:
              data = p.json()
          except Exception:
              print("ERROR: Prospero returned non-JSON data.")
              print(p.text[:10000])
              raise SystemExit(1)

          print()
          print("PROSPERO RESPONSE:")
          print(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              )[:30000]
          )

          if not data.get("success"):
              print()
              print("Prospero did not return patch data.")
              raise SystemExit(1)

          patches = data.get("patches", [])

          print()
          print("PATCH COUNT:", len(patches))

          if not patches:
              print("No GTA VI patches/pre-load data yet.")
              raise SystemExit(0)

          normalized = []

          for patch in patches:

              version = (
                  patch.get("content_ver")
                  or patch.get("version")
              )

              date = (
                  patch.get("import_date")
                  or patch.get("creation_date")
              )

              size = patch.get("filesize")
              firmware = patch.get("required_firmware")

              normalized.append({
                  "version": version,
                  "date": date[:10] if isinstance(date, str) else date,
                  "size": size,
                  "firmware": firmware,
                  "latest": bool(patch.get("is_latest"))
              })

          normalized = [
              x for x in normalized
              if x["version"]
          ]

          if not normalized:
              print("No usable versions found.")
              raise SystemExit(0)

          latest = next(
              (x for x in normalized if x["latest"]),
              normalized[0]
          )

          print()
          print("=" * 70)
          print("LATEST GTA VI DATA")
          print("=" * 70)

          print("VERSION:", latest["version"])
          print("DATE:", latest["date"])
          print("SIZE:", latest["size"])
          print("REQUIRED FIRMWARE:", latest["firmware"])

          previous = ""

          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  previous = f.read().strip()

          current = "\n".join([
              "GTA VI PS5",
              f"Version: {latest['version']}",
              f"Date: {latest['date']}",
              f"Size: {latest['size']}",
              f"Required Firmware: {latest['firmware']}",
          ])

          print()
          print("PREVIOUS STATE:")
          print(previous if previous else "(none)")

          print()
          print("CURRENT STATE:")
          print(current)

          # --------------------------------------------------
          # NO CHANGE
          # --------------------------------------------------

          if previous == current:
              print()
              print("NO CHANGE.")
              print("No Telegram notification needed.")
              raise SystemExit(0)

          # --------------------------------------------------
          # NEW DATA / UPDATE
          # --------------------------------------------------

          print()
          print("========================================")
          print("NEW GTA VI DATA DETECTED")
          print("========================================")

          if previous:

              message = f"""🎮 PS5 UPDATE

          GTA VI

          Version: {latest['version']}
          Size: {latest['size']}
          Date: {latest['date']}
          Required Firmware: {latest['firmware']}

          🆕 Update جدید شناسایی شد"""

          else:

              message = f"""🎮 PS5 UPDATE

          GTA VI

          Version: {latest['version']}
          Size: {latest['size']}
          Date: {latest['date']}
          Required Firmware: {latest['firmware']}

          🆕 اولین اطلاعات GTA VI شناسایی شد"""

          telegram_url = f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage"

          response = requests.post(
              telegram_url,
              data={
                  "chat_id": os.environ["CHAT_ID"],
                  "text": message
              },
              timeout=30
          )

          print("Telegram HTTP:", response.status_code)

          if response.status_code != 200:
              print("Telegram notification failed")
              print(response.text)
              raise SystemExit(1)

          print("Telegram notification sent")

          # فقط بعد از موفقیت تلگرام، وضعیت جدید ذخیره می‌شود.
          with open(STATE_FILE, "w", encoding="utf-8") as f:
              f.write(current + "\n")

          # --------------------------------------------------
          # SAVE TO GITHUB
          # --------------------------------------------------

          print()
          print("Updating repository state...")

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", STATE_FILE],
              check=True
          )

          result = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if result.returncode != 0:

              subprocess.run(
                  ["git", "commit", "-m", "Update GTA VI tracker"],
                  check=True
              )

              subprocess.run(
                  ["git", "pull", "--rebase", "origin", "main"],
                  check=True
              )

              subprocess.run(
                  ["git", "push", "origin", "main"],
                  check=True
              )

              print("GTA VI state saved successfully")

          else:
              print("No repository changes")

          print()
          print("GTA VI tracker finished")
          PY
