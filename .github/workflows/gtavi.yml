name: GTA VI Find API

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Find Prospero API
        run: |
          python3 - <<'PY'
          import requests
          import re

          files = [
              "https://prosperopatches.com/assets/js/scripts.js?v=1709144554",
              "https://prosperopatches.com/assets/js/homepage.js?v=1709144554"
          ]

          keywords = [
              "httpPost",
              "httpGet",
              "loadpatches",
              "/api/",
              "fetch(",
              "$.ajax",
              "ajax(",
              "titleid",
              "dynpatch",
              "patches",
              "patch"
          ]

          for url in files:

              print()
              print("=" * 80)
              print(url)
              print("=" * 80)

              r = requests.get(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"},
                  timeout=30
              )

              print("HTTP:", r.status_code)
              print("SIZE:", len(r.text))
              print()

              js = r.text
              found_positions = set()

              for keyword in keywords:

                  pos = 0

                  while True:

                      pos = js.lower().find(keyword.lower(), pos)

                      if pos == -1:
                          break

                      # جلوگیری از چاپ چندباره همان قسمت
                      block_start = max(0, pos - 600)
                      block_end = min(len(js), pos + 1200)

                      key = (block_start, block_end)

                      if key not in found_positions:

                          found_positions.add(key)

                          print()
                          print(f"--- MATCH: {keyword} ---")
                          print(js[block_start:block_end])
                          print("--- END ---")

                      pos += len(keyword)

              if not found_positions:
                  print("NO MATCHES")

          PY
