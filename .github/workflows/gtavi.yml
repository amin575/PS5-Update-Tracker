name: GTA VI Find Patch Endpoint

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect GTA VI page
        run: |
          python3 - <<'PY'
          import requests
          import re

          url = "https://prosperopatches.com/PPSA01547"

          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )

          text = r.text

          print("HTTP:", r.status_code)
          print("SIZE:", len(text))
          print()

          patterns = [
              r'data-url="[^"]+"',
              r'data-params="[^"]+"',
              r'data-endpoint="[^"]+"',
              r'data-func="[^"]+"',
              r'dynamicmodal[^>]*',
              r'dynamicform[^>]*',
              r'loadpatches',
              r'patches',
              r'api/internal'
          ]

          for pattern in patterns:
              print("=" * 70)
              print("PATTERN:", pattern)

              matches = list(re.finditer(pattern, text, re.I))

              print("MATCHES:", len(matches))

              for m in matches[:20]:
                  start = max(0, m.start() - 500)
                  end = min(len(text), m.end() + 1000)
                  print()
                  print(text[start:end])

          PY
