name: GTA VI PS5 Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  gtavi:
    runs-on: ubuntu-latest

    steps:
      - name: Find GTA VI on Prospero
        run: |
          python3 - <<'PY'
          import requests
          import json
          from urllib.parse import quote

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://prosperopatches.com/"
          }

          terms = [
              "Grand Theft Auto VI",
              "Grand Theft Auto 6",
              "GTA VI",
              "GTA 6"
          ]

          for term in terms:

              url = (
                  "https://prosperopatches.com/api/internal/search?term="
                  + quote(term)
              )

              print()
              print("=" * 80)
              print("SEARCH:", term)
              print("=" * 80)

              try:
                  r = requests.get(
                      url,
                      headers=headers,
                      timeout=30
                  )

                  print("HTTP:", r.status_code)

                  if not r.ok:
                      print("ERROR")
                      print(r.text[:5000])
                      continue

                  data = r.json()

                  print(
                      json.dumps(
                          data,
                          indent=2,
                          ensure_ascii=False
                      )[:20000]
                  )

                  results = data.get("results", [])

                  print()
                  print("RESULT COUNT:", len(results))

                  for i, item in enumerate(results):
                      print()
                      print("RESULT", i + 1)

                      if isinstance(item, dict):
                          for key, value in item.items():
                              print(f"{key}: {value}")
                      else:
                          print(item)

              except Exception as e:
                  print("ERROR:", repr(e))

          print()
          print("=" * 80)
          print("SEARCH COMPLETE")
          print("=" * 80)
          PY
