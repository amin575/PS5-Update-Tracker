name: GTA VI Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Install Playwright
        run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium --with-deps

      - name: Check GTA VI
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          cat > gtavi.py <<'PY'
          import asyncio
          import json
          import os
          import hashlib
          import requests
          from playwright.async_api import async_playwright

          TITLE_ID = "PPSA01547"
          URL = f"https://prosperopatches.com/{TITLE_ID}"

          async def main():

              captured = []

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox"]
                  )

                  page = await browser.new_page()

                  async def handle_response(response):
                      try:
                          if "/api/internal/" in response.url:
                              print("API:", response.request.method, response.url)

                              body = await response.text()

                              print("RESPONSE:")
                              print(body[:10000])

                              captured.append({
                                  "url": response.url,
                                  "method": response.request.method,
                                  "body": body
                              })

                      except Exception as e:
                          print("Intercept error:", e)

                  page.on("response", handle_response)

                  print("Opening:", URL)

                  await page.goto(
                      URL,
                      wait_until="networkidle",
                      timeout=120000
                  )

                  await page.wait_for_timeout(10000)

                  print()
                  print("=" * 80)
                  print("CAPTURED API REQUESTS:", len(captured))
                  print("=" * 80)

                  await browser.close()

              if not captured:
                  print("ERROR: No internal API request was captured.")
                  raise SystemExit(1)

              # Find the patch response
              patch_data = None

              for item in captured:
                  if "loadpatches" in item["url"].lower():
                      try:
                          data = json.loads(item["body"])

                          if isinstance(data, dict):
                              patch_data = data
                              break

                      except Exception:
                          pass

              if patch_data is None:
                  print("ERROR: loadpatches response was not found.")
                  raise SystemExit(1)

              print()
              print("=" * 80)
              print("PATCH DATA")
              print("=" * 80)
              print(json.dumps(patch_data, indent=2))

              # Save raw response
              with open("gtavi_data.json", "w", encoding="utf-8") as f:
                  json.dump(
                      patch_data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              # Create a stable fingerprint
              fingerprint = hashlib.sha256(
                  json.dumps(
                      patch_data,
                      sort_keys=True,
                      ensure_ascii=False
                  ).encode()
              ).hexdigest()

              old_fingerprint = ""

              if os.path.exists("gtavi_previous.txt"):
                  with open("gtavi_previous.txt", "r") as f:
                      old_fingerprint = f.read().strip()

              print()
              print("OLD:", old_fingerprint)
              print("NEW:", fingerprint)

              # First run: save only
              if not old_fingerprint:
                  with open("gtavi_previous.txt", "w") as f:
                      f.write(fingerprint)

                  print("First run. Baseline saved.")
                  return

              # Nothing changed
              if old_fingerprint == fingerprint:
                  print("No GTA VI update.")
                  return

              print("NEW GTA VI DATA DETECTED!")

              with open("gtavi_previous.txt", "w") as f:
                  f.write(fingerprint)

              # Telegram notification
              token = os.environ.get("BOT_TOKEN")
              chat_id = os.environ.get("CHAT_ID")

              if not token or not chat_id:
                  print("Telegram secrets are not configured.")
                  return

              message = (
                  "🚨 GTA VI PS5 UPDATE\n\n"
                  "Title ID: PPSA01547\n"
                  "New data detected on ProsperoPatches.\n\n"
                  "Check the latest package/update information."
              )

              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": message
                  },
                  timeout=30
              )

              print("Telegram:", response.status_code)
              print(response.text)

          asyncio.run(main())
          PY

          python3 gtavi.py

      - name: Save GTA VI state
        if: success()
        run: |
          if [ -f gtavi_previous.txt ]; then
            echo "GTA VI state:"
            cat gtavi_previous.txt
          fi
