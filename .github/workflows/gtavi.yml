name: GTA VI Key Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Prospero data
        run: |
          python - <<'PY'
          import requests
          import re

          url = "https://prosperopatches.com/PPSA01547"

          r = requests.get(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=30
          )

          print("HTTP:", r.status_code)
          print("SIZE:", len(r.text))
          print()

          html = r.text

          # Search for anything containing loadpatches
          print("===== LOADPATCHES =====")

          matches = re.findall(
              r'.{0,300}loadpatches.{0,500}',
              html,
              re.IGNORECASE
          )

          if matches:
              for x in matches:
                  print(x)
                  print()
          else:
              print("No loadpatches found")

          # Search for anything containing data-key
          print("===== DATA-KEY =====")

          matches = re.findall(
              r'.{0,300}data-key.{0,500}',
              html,
              re.IGNORECASE
          )

          if matches:
              for x in matches:
                  print(x)
                  print()
          else:
              print("No data-key found")

          # Search for key= style values
          print("===== KEY REFERENCES =====")

          matches = re.findall(
              r'.{0,200}(?:key|KEY).{0,400}',
              html
          )

          count = 0

          for x in matches:
              print(x)
              print()

              count += 1

              if count >= 30:
                  break

          # Save complete HTML for inspection
          with open("prospero.html", "w", encoding="utf-8") as f:
              f.write(html)

          print()
          print("Complete HTML saved.")
          PY
