name: GTA VI Find API URI

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Find apiUri
        run: |
          python3 - <<'PY'
          import requests
          import re

          urls = [
              "https://prosperopatches.com/PPSA01547",
              "https://prosperopatches.com/assets/js/global.js?v=1709144554",
              "https://prosperopatches.com/assets/js/scripts.js?v=1709144554",
              "https://prosperopatches.com/assets/js/homepage.js?v=1709144554"
          ]

          for url in urls:

              print()
              print("=" * 70)
              print(url)
              print("=" * 70)

              r = requests.get(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"},
                  timeout=30
              )

              text = r.text

              matches = list(re.finditer(r'apiUri', text, re.I))

              print("HTTP:", r.status_code)
              print("SIZE:", len(text))
              print("apiUri matches:", len(matches))

              for m in matches:

                  start = max(0, m.start() - 300)
                  end = min(len(text), m.end() + 500)

                  print()
                  print(text[start:end])

          PY
