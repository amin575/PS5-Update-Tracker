name: GTA VI Inspect Scripts

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect Prospero scripts
        run: |
          python3 - <<'PY'
          import requests
          import re
          from urllib.parse import urljoin

          url = "https://prosperopatches.com/PPSA01547"

          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )

          print("PAGE HTTP:", r.status_code)
          print("PAGE SIZE:", len(r.text))
          print()

          html = r.text

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          scripts = [urljoin(url, x) for x in scripts]

          print("========== SCRIPT FILES ==========")

          for i, js_url in enumerate(scripts, 1):
              print(f"{i}. {js_url}")

          print()
          print("TOTAL SCRIPTS:", len(scripts))

          keywords = [
              "fetch(",
              "$.ajax",
              "XMLHttpRequest",
              "httpPost",
              "httpGet",
              "loadpatches",
              "/api/",
              "dynpatch",
              "titleid",
              "prospero",
              "patch"
          ]

          for i, js_url in enumerate(scripts, 1):

              print()
              print("=" * 80)
              print(f"SCRIPT {i}: {js_url}")
              print("=" * 80)

              try:
                  jr = requests.get(
                      js_url,
                      headers={"User-Agent": "Mozilla/5.0"},
                      timeout=30
                  )

                  print("HTTP:", jr.status_code)
                  print("SIZE:", len(jr.text))
                  print()

                  js = jr.text
                  found = False

                  for keyword in keywords:
                      start_pos = 0

                      while True:
                          pos = js.lower().find(keyword.lower(), start_pos)

                          if pos == -1:
                              break

                          found = True

                          start = max(0, pos - 700)
                          end = min(len(js), pos + 1500)

                          print(f"--- MATCH: {keyword} ---")
                          print(js[start:end])
                          print("--- END MATCH ---")
                          print()

                          start_pos = pos + len(keyword)

                  if not found:
                      print("NO RELEVANT MATCHES")

              except Exception as e:
                  print("ERROR:", e)

          print()
          print("=" * 80)
          print("INLINE SCRIPTS")
          print("=" * 80)

          inline = re.findall(
              r'<script(?![^>]+src=)[^>]*>(.*?)</script>',
              html,
              re.I | re.S
          )

          print("INLINE SCRIPT COUNT:", len(inline))

          for i, content in enumerate(inline, 1):

              if content.strip():

                  print()
                  print(f"--- INLINE SCRIPT {i} ---")
                  print(content)
                  print(f"--- END INLINE SCRIPT {i} ---")

          PY
