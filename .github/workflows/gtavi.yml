name: GTA VI Find Internal API

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Search API calls
        run: |
          python3 - <<'PY'
          import requests
          import re

          base = "https://prosperopatches.com"

          urls = [
              base + "/PPSA01547",
              base + "/assets/js/global.js?v=1709144554",
              base + "/assets/js/utils.js?v=1709144554",
              base + "/assets/js/scripts.js?v=1709144554",
              base + "/assets/js/homepage.js?v=1709144554"
          ]

          for url in urls:
              print()
              print("=" * 80)
              print(url)
              print("=" * 80)

              r = requests.get(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"},
                  timeout=30
              )

              text = r.text

              patterns = [
                  r'/api/internal[^"\']*',
                  r'apiUri\s*\+\s*[\'"][^\'"]+',
                  r'titleid',
                  r'TitleId',
                  r'PPSA01547',
                  r'load[A-Za-z]+',
                  r'patch[A-Za-z]+',
                  r'patches[A-Za-z]+'
              ]

              for pattern in patterns:
                  matches = list(re.finditer(pattern, text, re.I))

                  print()
                  print("PATTERN:", pattern)
                  print("MATCHES:", len(matches))

                  shown = set()

                  for m in matches:
                      start = max(0, m.start() - 250)
                      end = min(len(text), m.end() + 500)

                      snippet = text[start:end]

                      if snippet not in shown:
                          print("-" * 60)
                          print(snippet)
                          shown.add(snippet)

          PY
