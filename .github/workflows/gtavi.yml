name: GTA VI Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GTA VI update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import requests
          import re
          import json
          import os
          import subprocess

          BASE = "https://prosperopatches.com"
          TITLE_ID = "PPSA01547"
          PAGE = f"{BASE}/{TITLE_ID}"
          API = f"{BASE}/api/internal/loadpatches"

          STATE_FILE = "gtavi_version.txt"

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          print("🎮 GTA VI PS5")
          print("Opening Prospero page...")
          print(PAGE)
          print()

          session = requests.Session()

          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36"
          })

          # --------------------------------------------------
          # 1. Open GTA VI Prospero page
          # --------------------------------------------------

          page = session.get(
              PAGE,
              timeout=30
          )

          print("Page HTTP:", page.status_code)
          print("Page size:", len(page.text))

          if page.status_code != 200:
              print("❌ Failed to open Prospero page")
              raise SystemExit(1)

          html = page.text

          # --------------------------------------------------
          # 2. Extract GTA VI's own Prospero key
          # --------------------------------------------------

          match = re.search(
              r'data-titleid="([^"]+)"\s+data-key="([0-9a-f]+)"',
              html,
              re.IGNORECASE
          )

          if not match:
              # Fallback for the alternative markup format
              packed = re.search(
                  r'id="dynpatch"[^>]*data-loadparams="\{([^"]+)\}"',
                  html
              )

              if packed:
                  title_match = re.search(
                      r'["\']titleid["\']\s*:\s*["\']([A-Z0-9]+)["\']',
                      packed.group(1),
                      re.IGNORECASE
                  )

                  key_match = re.search(
                      r'["\']key["\']\s*:\s*["\']([0-9a-f]+)["\']',
                      packed.group(1),
                      re.IGNORECASE
                  )

                  if title_match and key_match:
                      titleid = title_match.group(1)
                      key = key_match.group(1)
                  else:
                      titleid = None
                      key = None
              else:
                  titleid = None
                  key = None
          else:
              titleid = match.group(1)
              key = match.group(2)

          if not titleid or not key:
              print("❌ GTA VI Prospero key was not found")
              print("The Prospero page markup may have changed.")
              raise SystemExit(1)

          print("Title ID:", titleid)
          print("Prospero key found successfully")
          print()

          # --------------------------------------------------
          # 3. Request patch list
          # --------------------------------------------------

          payload = {
              "titleid": titleid,
              "key": key
          }

          print("Requesting patch list...")

          response = session.post(
              API,
              data=json.dumps(payload),
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                  "Accept": "application/json",
                  "Referer": PAGE,
                  "Origin": BASE,
                  "X-Requested-With": "XMLHttpRequest"
              }
          )

          print("API HTTP:", response.status_code)

          if response.status_code != 200:
              print("❌ Prospero API request failed")
              print(response.text)
              raise SystemExit(1)

          try:
              data = response.json()
          except Exception:
              print("❌ Prospero returned invalid JSON")
              print(response.text)
              raise SystemExit(1)

          if not data.get("success"):
              print("❌ Prospero API returned failure")
              print(data)
              raise SystemExit(1)

          patches = data.get("patches", [])

          if not patches:
              print("❌ No GTA VI patches found")
              raise SystemExit(1)

          print("Patches found:", len(patches))
          print()

          # --------------------------------------------------
          # 4. Find latest patch
          # --------------------------------------------------

          latest = None

          for patch in patches:
              if patch.get("is_latest"):
                  latest = patch
                  break

          if latest is None:
              latest = patches[0]

          version = latest.get("content_ver")
          size = latest.get("filesize")
          firmware = latest.get("required_firmware")
          import_date = latest.get("import_date")

          if not version:
              print("❌ Could not find GTA VI version")
              print(latest)
              raise SystemExit(1)

          print("================================")
          print("GTA VI CURRENT DATA")
          print("================================")
          print("Version:", version)
          print("Size:", size)
          print("Required firmware:", firmware)
          print("Import date:", import_date)
          print("================================")
          print()

          # --------------------------------------------------
          # 5. Read previous version
          # --------------------------------------------------

          old_version = ""

          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r") as f:
                  old_version = f.read().strip()

          print(
              "Previous version:",
              old_version if old_version else "None"
          )

          # --------------------------------------------------
          # 6. First run
          # --------------------------------------------------

          if not old_version:

              print("First run - saving current GTA VI version")

              with open(STATE_FILE, "w") as f:
                  f.write(version)

          # --------------------------------------------------
          # 7. New update detected
          # --------------------------------------------------

          elif old_version != version:

              print()
              print("🆕 NEW GTA VI UPDATE DETECTED")
              print()

              message = f"""🎮 PS5 UPDATE

Grand Theft Auto VI

Version: {version}
Size: {size or "Unknown"}
Required firmware: {firmware or "Unknown"}
Import date: {import_date or "Unknown"}

🆕 GTA VI Update جدید شناسایی شد"""

              telegram_url = (
                  f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              )

              telegram_response = requests.post(
                  telegram_url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=30
              )

              print(
                  "Telegram HTTP:",
                  telegram_response.status_code
              )

              if telegram_response.status_code != 200:
                  print("❌ Telegram notification failed")
                  print(telegram_response.text)
                  raise SystemExit(1)

              print("✅ Telegram notification sent")

              with open(STATE_FILE, "w") as f:
                  f.write(version)

          else:

              print("No new GTA VI update")

          # --------------------------------------------------
          # 8. Save state to GitHub
          # --------------------------------------------------

          print()
          print("Updating repository state...")

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", STATE_FILE],
              check=True
          )

          result = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if result.returncode != 0:

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update GTA VI version"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "pull",
                      "--rebase",
                      "origin",
                      "main"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "push",
                  ],
                  check=True
              )

              print("✅ GTA VI version state saved")

          else:

              print("No repository changes")

          print()
          print("🎮 GTA VI tracker finished")
          PY
