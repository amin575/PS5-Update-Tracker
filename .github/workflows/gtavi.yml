name: GTA VI Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check GTA VI
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          cat > check_gta.js <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const TITLE_ID = "PPSA01547";
          const PAGE_URL = "https://prosperopatches.com/PPSA01547";
          const STATE_FILE = "gtavi_latest.txt";

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            let patchData = null;

            page.on("response", async (response) => {
              const url = response.url();

              if (!url.includes("/api/internal/loadpatches")) {
                return;
              }

              console.log("Found Prospero API request:");
              console.log(url);

              try {
                const json = await response.json();

                console.log("Prospero API response received.");

                if (json && json.success && json.patches) {
                  patchData = json;
                }
              } catch (error) {
                console.log("Could not read API response.");
              }
            });

            console.log("Opening GTA VI Prospero page...");

            await page.goto(PAGE_URL, {
              waitUntil: "networkidle",
              timeout: 60000
            });

            console.log("Page loaded.");

            await page.waitForTimeout(5000);

            if (!patchData) {
              console.log("API data was not captured.");
              await browser.close();
              process.exit(1);
            }

            const patches = patchData.patches;

            if (!patches || patches.length === 0) {
              console.log("No GTA VI patches found.");
              await browser.close();
              process.exit(1);
            }

            const latest = patches[0];

            const version =
              String(latest.content_ver ?? "Unknown");

            const size =
              String(latest.filesize ?? "Unknown");

            const firmware =
              String(latest.required_firmware ?? "Unknown");

            const importDate =
              String(latest.import_date ?? "Unknown");

            console.log("");
            console.log("===== GTA VI =====");
            console.log("Version:", version);
            console.log("Size:", size);
            console.log("Firmware:", firmware);
            console.log("Import Date:", importDate);
            console.log("==================");
            console.log("");

            const newData =
              "🎮 GTA VI PS5\n\n" +
              "Version: " + version + "\n" +
              "Size: " + size + "\n" +
              "Firmware: " + firmware + "\n" +
              "Import Date: " + importDate;

            let oldData = "";

            if (fs.existsSync(STATE_FILE)) {
              oldData = fs.readFileSync(
                STATE_FILE,
                "utf8"
              ).trim();
            }

            if (!oldData) {

              console.log(
                "First run - saving current GTA VI data."
              );

              fs.writeFileSync(
                STATE_FILE,
                newData
              );

            } else if (oldData !== newData) {

              console.log(
                "NEW GTA VI DATA FOUND!"
              );

              const token = process.env.BOT_TOKEN;
              const chatId = process.env.CHAT_ID;

              const message =
                "🎮 GTA VI PS5\n\n" +
                "🆕 دیتای جدید GTA VI شناسایی شد\n\n" +
                "Version: " + version + "\n" +
                "Size: " + size + "\n" +
                "Firmware: " + firmware + "\n" +
                "Import Date: " + importDate;

              const telegramUrl =
                "https://api.telegram.org/bot" +
                token +
                "/sendMessage";

              const telegramResponse =
                await fetch(telegramUrl, {
                  method: "POST",
                  headers: {
                    "Content-Type":
                      "application/json"
                  },
                  body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                  })
                });

              console.log(
                "Telegram HTTP:",
                telegramResponse.status
              );

              if (!telegramResponse.ok) {
                console.log(
                  await telegramResponse.text()
                );

                await browser.close();
                process.exit(1);
              }

              fs.writeFileSync(
                STATE_FILE,
                newData
              );

              console.log(
                "Telegram notification sent."
              );

            } else {

              console.log(
                "No GTA VI changes."
              );
            }

            await browser.close();
          })();
          NODE

          node check_gta.js

      - name: Save GTA VI state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gtavi_latest.txt

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update GTA VI data"
            git push origin main
          fi
