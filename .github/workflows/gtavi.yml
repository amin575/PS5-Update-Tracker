name: GTA VI Find Page Data

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Find GTA VI data
        run: |
          python3 - <<'PY'
          import requests
          import re

          url = "https://prosperopatches.com/PPSA01547"

          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )

          text = r.text

          # Remove HTML tags only for easier inspection
          clean = re.sub(r'<[^>]+>', ' ', text)
          clean = re.sub(r'\s+', ' ', clean)

          print("HTTP:", r.status_code)
          print("SIZE:", len(text))
          print()

          keywords = [
              "Grand Theft Auto",
              "GTA",
              "PPSA01547",
              "EP1004",
              "PPSA",
              "key",
              "patch",
              "title"
          ]

          for keyword in keywords:
              print("=" * 80)
              print("KEYWORD:", keyword)

              matches = list(re.finditer(
                  re.escape(keyword),
                  text,
                  re.I
              ))

              print("MATCHES:", len(matches))

              for m in matches[:10]:
                  start = max(0, m.start() - 1000)
                  end = min(len(text), m.end() + 2000)

                  print()
                  print(text[start:end])

          print()
          print("=" * 80)
          print("LINKS")
          print("=" * 80)

          links = re.findall(
              r'href=["\']([^"\']+)["\']',
              text,
              re.I
          )

          for link in links:
              if "PPSA" in link or "patch" in link.lower() or "title" in link.lower():
                  print(link)

          PY
