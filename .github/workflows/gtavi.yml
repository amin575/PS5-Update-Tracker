name: GTA VI Find API Details

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Extract API details
        run: |
          python3 - <<'PY'
          import requests
          import re

          url = "https://prosperopatches.com/assets/js/scripts.js?v=1709144554"

          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )

          js = r.text

          print("HTTP:", r.status_code)
          print("SIZE:", len(js))
          print()

          patterns = [
              r'.{0,1000}apiUri.{0,1500}',
              r'.{0,1000}endpoint.{0,2000}',
              r'.{0,1000}dynamicresponse.{0,2000}',
              r'.{0,1000}submitData.{0,1500}'
          ]

          for pattern in patterns:
              print("=" * 80)

              matches = re.findall(
                  pattern,
                  js,
                  re.IGNORECASE | re.DOTALL
              )

              if matches:
                  for m in matches:
                      print(m)
                      print()
              else:
                  print("NO MATCH")
                  print()

          PY
