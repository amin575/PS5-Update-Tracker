name: GTA VI Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GTA VI
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import requests
          import os
          import re
          import json
          import subprocess

          TITLE_ID = "PPSA01547"
          PAGE_URL = "https://prosperopatches.com/PPSA01547"
          API_URL = "https://prosperopatches.com/api/internal/loadpatches"
          STATE_FILE = "gtavi_latest.txt"

          session = requests.Session()

          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          })

          print("Opening GTA VI Prospero page...")

          page = session.get(
              PAGE_URL,
              timeout=30
          )

          print("Page HTTP:", page.status_code)

          if page.status_code != 200:
              print(page.text[:1000])
              raise SystemExit(1)

          html = page.text

          print("Page size:", len(html))

          # Find the per-title API key from the page HTML.
          key = None

          patterns = [
              r'["\']key["\']\s*:\s*["\']([a-fA-F0-9]{32,})["\']',
              r'data-key=["\']([^"\']+)["\']',
              r'data-api-key=["\']([^"\']+)["\']',
              r'key\s*=\s*["\']([a-fA-F0-9]{32,})["\']'
          ]

          for pattern in patterns:
              match = re.search(pattern, html, re.IGNORECASE)

              if match:
                  key = match.group(1)
                  print("Found page key.")
                  break

          if not key:
              print("ERROR: GTA VI page key was not found.")
              print("The Prospero page HTML may have changed.")
              raise SystemExit(1)

          print("Loading GTA VI patches...")

          api_headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
              "Referer": PAGE_URL,
              "Origin": "https://prosperopatches.com",
              "X-Requested-With": "XMLHttpRequest"
          }

          payload = {
              "titleid": TITLE_ID,
              "key": key
          }

          response = session.post(
              API_URL,
              headers=api_headers,
              data=json.dumps(payload),
              timeout=30
          )

          print("API HTTP:", response.status_code)

          if response.status_code != 200:
              print(response.text)
              raise SystemExit(1)

          result = response.json()

          print(result)

          if not result.get("success"):
              print("Prospero API returned an error.")
              raise SystemExit(1)

          patches = result.get("patches", [])

          if not patches:
              print("No GTA VI patches found.")
              raise SystemExit(1)

          latest = patches[0]

          version = str(latest.get("content_ver", "Unknown"))
          size = str(latest.get("filesize", "Unknown"))
          firmware = str(latest.get("required_firmware", "Unknown"))
          import_date = str(latest.get("import_date", "Unknown"))

          print()
          print("===== GTA VI =====")
          print("Version:", version)
          print("Size:", size)
          print("Firmware:", firmware)
          print("Import Date:", import_date)
          print("==================")
          print()

          new_data = (
              "🎮 GTA VI PS5\n\n"
              "Version: " + version + "\n"
              "Size: " + size + "\n"
              "Firmware: " + firmware + "\n"
              "Import Date: " + import_date
          )

          old_data = ""

          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r") as f:
                  old_data = f.read().strip()

          if not old_data:

              print("First run.")
              print("Saving current GTA VI data without notification.")

              with open(STATE_FILE, "w") as f:
                  f.write(new_data)

          elif old_data != new_data:

              print("NEW GTA VI DATA FOUND!")

              token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]

              telegram_url = (
                  "https://api.telegram.org/bot"
                  + token
                  + "/sendMessage"
              )

              message = (
                  "🎮 GTA VI PS5\n\n"
                  "🆕 دیتای جدید GTA VI شناسایی شد\n\n"
                  "Version: " + version + "\n"
                  "Size: " + size + "\n"
                  "Firmware: " + firmware + "\n"
                  "Import Date: " + import_date
              )

              telegram = requests.post(
                  telegram_url,
                  data={
                      "chat_id": chat_id,
                      "text": message
                  },
                  timeout=30
              )

              print("Telegram HTTP:", telegram.status_code)

              if telegram.status_code != 200:
                  print(telegram.text)
                  raise SystemExit(1)

              with open(STATE_FILE, "w") as f:
                  f.write(new_data)

              print("Telegram notification sent.")

          else:

              print("No GTA VI changes.")

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", STATE_FILE],
              check=True
          )

          check = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if check.returncode != 0:

              subprocess.run(
                  ["git", "commit", "-m", "Update GTA VI data"],
                  check=True
              )

              subprocess.run(
                  ["git", "push", "origin", "main"],
                  check=True
              )

              print("GTA VI state saved.")

          else:

              print("Nothing to commit.")

          PY
