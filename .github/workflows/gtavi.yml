name: GTA VI Key Capture

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps

      - name: Capture Prospero request
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True
                  )

                  page = await browser.new_page()

                  captured = []

                  async def response_handler(response):

                      url = response.url

                      if "loadpatches" in url.lower():

                          print()
                          print("================================")
                          print("LOADPATCHES REQUEST FOUND")
                          print("================================")
                          print("URL:")
                          print(url)
                          print()

                          print("METHOD:")
                          print(response.request.method)
                          print()

                          print("REQUEST HEADERS:")
                          print(await response.request.all_headers())
                          print()

                          try:
                              print("POST DATA:")
                              print(response.request.post_data)
                          except:
                              print("POST DATA: None")

                          print()
                          print("RESPONSE:")
                          
                          try:
                              print(await response.text())
                          except Exception as e:
                              print("Could not read response:", e)

                          captured.append(True)

                  page.on(
                      "response",
                      response_handler
                  )

                  print("Opening GTA VI Prospero page...")

                  try:

                      await page.goto(
                          "https://prosperopatches.com/PPSA01547",
                          wait_until="domcontentloaded",
                          timeout=20000
                      )

                  except Exception as e:

                      print(
                          "Page load warning:",
                          e
                      )

                  print("Page loaded.")

                  # Give the site's JavaScript time
                  # to make its API request.
                  for i in range(20):

                      if captured:
                          break

                      await page.wait_for_timeout(1000)

                      print(
                          "Waiting for API request...",
                          i + 1
                      )

                  if not captured:

                      print()
                      print(
                          "❌ LOADPATCHES REQUEST WAS NOT CAPTURED"
                      )

                  else:

                      print()
                      print(
                          "✅ REQUEST CAPTURED SUCCESSFULLY"
                      )

                  await browser.close()

          asyncio.run(main())
          PY
