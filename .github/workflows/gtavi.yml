name: GTA VI Utils Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Read Prospero utils.js
        run: |
          python3 - <<'PY'
          import requests

          url = "https://prosperopatches.com/assets/js/utils.js?v=1709144554"

          print("Downloading utils.js...")
          print(url)
          print()

          r = requests.get(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=30
          )

          print("HTTP:", r.status_code)
          print("SIZE:", len(r.text))
          print()
          print("========== utils.js ==========")
          print(r.text)
          print("========== END ==========")
          PY
