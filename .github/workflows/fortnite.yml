name: Fortnite Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Fortnite update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import requests
          import re
          import os
          import subprocess

          URL = "https://framepatch.app/games/fortnite"
          STATE_FILE = "fortnite_version.txt"

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          print("Fortnite PS5")
          print("Checking:", URL)

          r = requests.get(URL, timeout=30)

          print("HTTP:", r.status_code)

          if r.status_code != 200:
              print("Failed to fetch Fortnite page")
              raise SystemExit(1)

          html = r.text

          match = re.search(
              r"Patch\s+([0-9.]+)\s*[·•]\s*([0-9.]+\s*(?:GB|MB))",
              html,
              re.IGNORECASE
          )

          if not match:
              print("Could not find Fortnite patch information")
              raise SystemExit(1)

          version = match.group(1)
          size = match.group(2)

          print("Current version:", version)
          print("Current size:", size)

          old_version = ""

          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r") as f:
                  old_version = f.read().strip()

          print("Previous version:", old_version if old_version else "None")

          if not old_version:
              print("First run - saving version")

              with open(STATE_FILE, "w") as f:
                  f.write(version)

          elif old_version != version:
              print("NEW FORTNITE UPDATE DETECTED")

              message = f"""🎮 PS5 UPDATE

          Fortnite

          Version: {version}
          Size: {size}

          🆕 Update جدید شناسایی شد"""

              telegram_url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

              response = requests.post(
                  telegram_url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=30
              )

              print("Telegram HTTP:", response.status_code)

              if response.status_code != 200:
                  print("Telegram notification failed")
                  print(response.text)
                  raise SystemExit(1)

              print("Telegram notification sent")

              with open(STATE_FILE, "w") as f:
                  f.write(version)

          else:
              print("No new Fortnite update")

          result = subprocess.run(
              ["git", "status", "--porcelain"],
              capture_output=True,
              text=True
          )

          if result.stdout.strip():
              subprocess.run(
                  ["git", "config", "user.name", "github-actions[bot]"],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(
                  ["git", "add", STATE_FILE],
                  check=True
              )

              subprocess.run(
                  ["git", "commit", "-m", "Update Fortnite version"],
                  check=True
              )

              subprocess.run(
                  ["git", "push"],
                  check=True
              )

              print("Version state saved")

          print("Fortnite tracker finished")
          PY
