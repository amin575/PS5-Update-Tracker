name: Fortnite Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: fortnite-update-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Fortnite update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import time
          import subprocess
          import requests

          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          BUILD_URL = (
              "https://raw.githubusercontent.com/"
              "Fortnite-Datamining/Fortnite-Datamining/"
              "main/data/meta/build_info.json"
          )

          BASE = "https://prosperopatches.com"
          TITLE_ID = "PPSA01922"
          PAGE = BASE + "/" + TITLE_ID
          API = BASE + "/api/internal/loadpatches"

          # Same request key and request format as the working Warzone tracker.
          KEY = (
              "db36a93c8bdfcc99c6c0170671c3b49d"
              "75a9873eb3c634fde0ab26392353a299"
          )

          STATE_FILE = "fortnite_version.txt"
          LATEST_FILE = "fortnite_latest.txt"
          DATE_FILE = "fortnite_notification_date.txt"

          BOT_TOKEN = os.environ.get("BOT_TOKEN", "")
          CHAT_ID = os.environ.get("CHAT_ID", "")

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json, text/plain, */*"
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def read_file(filename):
              if not os.path.exists(filename):
                  return ""

              with open(filename, "r", encoding="utf-8") as f:
                  return f.read().strip()

          def write_file(filename, content):
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(content)

          def version_key(value):
              numbers = re.findall(r"\d+", str(value or ""))
              return tuple(int(n) for n in numbers) if numbers else (0,)

          def is_newer(candidate, previous):
              return version_key(candidate) > version_key(previous)

          def parse_date(value):
              if not value:
                  return datetime.min.replace(tzinfo=timezone.utc)

              value = str(value).strip()

              try:
                  dt = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt.astimezone(timezone.utc)

              except (ValueError, TypeError):
                  pass

              for fmt in (
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M",
                  "%Y-%m-%d"
              ):
                  try:
                      return datetime.strptime(
                          value, fmt
                      ).replace(tzinfo=timezone.utc)
                  except ValueError:
                      continue

              return datetime.min.replace(tzinfo=timezone.utc)

          def normalize_size(value):
              if value is None or value == "":
                  return "نامشخص"

              if isinstance(value, str):
                  value = value.strip()

                  if not value:
                      return "نامشخص"

                  # If the API already includes a unit, preserve it.
                  if re.search(
                      r"\b(GB|MB|KB|TB|GiB|MiB)\b",
                      value,
                      re.IGNORECASE
                  ):
                      return value

                  # Continue parsing numeric strings below.
                  try:
                      number = float(value.replace(",", ""))
                  except ValueError:
                      return value

              else:
                  try:
                      number = float(value)
                  except (TypeError, ValueError):
                      return str(value)

              # Large numeric values are assumed to be bytes.
              if number >= 1_000_000_000:
                  return f"{number / 1_000_000_000:.2f} GB"

              # Smaller numeric values from this source are commonly
              # expressed in GB; retain the value without false precision.
              if number > 0:
                  return f"{number:g} GB"

              return "نامشخص"

          def get_game_version():
              print("Fetching Fortnite build information...")

              response = session.get(BUILD_URL, timeout=30)
              response.raise_for_status()

              data = response.json()
              build = str(data.get("build", "")).strip()

              match = re.search(
                  r"Release-([0-9]+(?:\.[0-9]+)+)",
                  build
              )

              if not match:
                  raise RuntimeError(
                      "Could not identify Fortnite version: " + build
                  )

              version = match.group(1)

              print("Fortnite game version:", version)

              return version

          def get_ps5_patches():
              print("Opening ProsperoPatches:", PAGE)

              page_response = session.get(PAGE, timeout=30)

              print("Page HTTP:", page_response.status_code)
              page_response.raise_for_status()

              payload = {
                  "titleid": TITLE_ID,
                  "key": KEY
              }

              # Keep the exact request format used by the working
              # Warzone workflow.
              response = session.post(
                  API,
                  data=json.dumps(payload),
                  timeout=30,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Content-Type": (
                          "application/x-www-form-urlencoded; charset=UTF-8"
                      ),
                      "Accept": "application/json",
                      "Referer": PAGE,
                      "Origin": BASE,
                      "X-Requested-With": "XMLHttpRequest"
                  }
              )

              print("API HTTP:", response.status_code)
              response.raise_for_status()

              try:
                  data = response.json()
              except ValueError:
                  print(response.text[:1500])
                  raise RuntimeError(
                      "ProsperoPatches returned invalid JSON."
                  )

              if not isinstance(data, dict):
                  raise RuntimeError(
                      "Unexpected ProsperoPatches response."
                  )

              if not data.get("success"):
                  print("API response:", data)
                  raise RuntimeError(
                      "ProsperoPatches rejected the request: "
                      + str(data.get("message", "Unknown error"))
                  )

              patches = data.get("patches", [])

              if not isinstance(patches, list) or not patches:
                  print("API response:", data)
                  raise RuntimeError(
                      "No Fortnite PS5 patches were returned."
                  )

              valid = [
                  patch for patch in patches
                  if isinstance(patch, dict)
                  and str(patch.get("content_ver") or "").strip()
              ]

              if not valid:
                  raise RuntimeError(
                      "No patches with a valid content_ver were returned."
                  )

              valid.sort(
                  key=lambda patch: (
                      parse_date(patch.get("import_date")),
                      version_key(patch.get("content_ver"))
                  ),
                  reverse=True
              )

              print("Patches received:", len(valid))

              return valid

          def load_state():
              raw = read_file(STATE_FILE)

              if not raw:
                  return None

              # New JSON format.
              try:
                  state = json.loads(raw)

                  if isinstance(state, dict):
                      return state

              except json.JSONDecodeError:
                  pass

              # Compatibility with the previous format:
              # game_version|ps5_version
              parts = raw.split("|")

              if len(parts) >= 2:
                  return {
                      "game_version": parts[0].strip(),
                      "ps5_version": parts[1].strip(),
                      "patch_date": "",
                      "size": ""
                  }

              # Compatibility with a version-only state file.
              if re.fullmatch(r"\d+(?:\.\d+)+", raw):
                  return {
                      "game_version": "",
                      "ps5_version": raw,
                      "patch_date": "",
                      "size": ""
                  }

              return None

          def save_state(state):
              write_file(
                  STATE_FILE,
                  json.dumps(
                      state,
                      ensure_ascii=False,
                      indent=2
                  )
              )

          def make_latest(
              game_version,
              ps5_version,
              patch_date,
              notification_date,
              size,
              firmware
          ):
              return (
                  "🎮 FORTNITE PS5\n\n"
                  f"Fortnite Version: {game_version}\n"
                  f"PS5 Version: {ps5_version}\n"
                  f"Patch Added: {patch_date or 'نامشخص'}\n"
                  f"Last Notification Date: {notification_date}\n"
                  f"Update Size: {size}\n"
                  f"Required Firmware: {firmware}\n"
              )

          print("Fortnite tracker started.")

          # 1. Current Fortnite game version.
          game_version = get_game_version()

          # 2. Current PS5 patch information.
          patches = get_ps5_patches()
          latest_patch = patches[0]

          source_version = str(
              latest_patch.get("content_ver") or ""
          ).strip()

          source_date = str(
              latest_patch.get("import_date") or ""
          ).strip()

          source_size_raw = latest_patch.get("filesize")
          source_size = normalize_size(source_size_raw)

          source_firmware = str(
              latest_patch.get("required_firmware") or "نامشخص"
          ).strip()

          print("Latest API patch version:", source_version)
          print("API patch date:", source_date or "Unknown")
          print("API patch size:", source_size)
          print("Required firmware:", source_firmware)

          # 3. Previous state.
          old_state = load_state()

          if old_state:
              old_game_version = str(
                  old_state.get("game_version") or ""
              ).strip()

              old_ps5_version = str(
                  old_state.get("ps5_version") or ""
              ).strip()
          else:
              old_game_version = ""
              old_ps5_version = ""

          print("Previous game version:", old_game_version or "None")
          print("Previous PS5 version:", old_ps5_version or "None")

          notification_date = read_file(DATE_FILE)

          if not notification_date and old_state:
              notification_date = str(
                  old_state.get("notification_date") or ""
              ).strip()

          if not notification_date:
              notification_date = "هنوز اعلانی ارسال نشده"

          now_tehran = datetime.now(ZoneInfo("Asia/Tehran"))
          today = now_tehran.strftime("%Y-%m-%d")

          # 4. Protect against a temporary source regression.
          if (
              old_ps5_version
              and version_key(source_version)
                  < version_key(old_ps5_version)
          ):
              print(
                  "WARNING: API returned an older patch. "
                  "Keeping the previously saved version."
              )

              selected_version = old_ps5_version
              selected_size = "نامشخص"
              selected_date = ""
              selected_firmware = "نامشخص"

          else:
              selected_version = source_version
              selected_size = source_size
              selected_date = source_date
              selected_firmware = source_firmware

          print("Selected PS5 version:", selected_version)
          print("Selected size:", selected_size)

          # 5. First run establishes a baseline without a false alert.
          if not old_state:
              print("First run: saving baseline without notification.")

              state = {
                  "game_version": game_version,
                  "ps5_version": selected_version,
                  "patch_date": selected_date,
                  "size": source_size_raw,
                  "notification_date": ""
              }

              save_state(state)

              write_file(
                  LATEST_FILE,
                  make_latest(
                      game_version,
                      selected_version,
                      selected_date,
                      notification_date,
                      selected_size,
                      selected_firmware
                  )
              )

          else:
              # Notify only when the PS5 patch version is newer.
              new_update = (
                  bool(old_ps5_version)
                  and is_newer(
                      selected_version,
                      old_ps5_version
                  )
              )

              print("New PS5 update detected:", new_update)

              if new_update:
                  if not BOT_TOKEN or not CHAT_ID:
                      raise RuntimeError(
                          "BOT_TOKEN or CHAT_ID secret is missing."
                      )

                  message = (
                      "🎮 FORTNITE PS5 UPDATE\n\n"
                      f"Fortnite Version: {game_version}\n"
                      f"PS5 Version: {selected_version}\n"
                      f"Patch Added: {selected_date or 'نامشخص'}\n"
                      f"Notification Date: {today}\n"
                      f"Update Size: {selected_size}\n"
                      f"Required Firmware: {selected_firmware}\n\n"
                      "🆕 آپدیت جدید PS5 شناسایی شد"
                  )

                  telegram_url = (
                      f"https://api.telegram.org/bot"
                      f"{BOT_TOKEN}/sendMessage"
                  )

                  telegram_response = requests.post(
                      telegram_url,
                      json={
                          "chat_id": CHAT_ID,
                          "text": message
                      },
                      timeout=30
                  )

                  print(
                      "Telegram HTTP:",
                      telegram_response.status_code
                  )

                  telegram_response.raise_for_status()

                  telegram_result = telegram_response.json()

                  if not telegram_result.get("ok"):
                      print(telegram_result)
                      raise RuntimeError(
                          "Telegram did not confirm the notification."
                      )

                  notification_date = today

                  write_file(DATE_FILE, notification_date)

                  print("Telegram notification sent successfully.")

              else:
                  print("No newer PS5 patch detected.")

              state = {
                  "game_version": game_version,
                  "ps5_version": selected_version,
                  "patch_date": selected_date,
                  "size": (
                      source_size_raw
                      if selected_version == source_version
                      else ""
                  ),
                  "notification_date": (
                      ""
                      if notification_date == "هنوز اعلانی ارسال نشده"
                      else notification_date
                  )
              }

              save_state(state)

              write_file(
                  LATEST_FILE,
                  make_latest(
                      game_version,
                      selected_version,
                      selected_date,
                      notification_date,
                      selected_size,
                      selected_firmware
                  )
              )

          # 6. Commit updated files to GitHub.
          subprocess.run(
              [
                  "git", "config", "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git", "config", "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git", "add",
                  STATE_FILE,
                  LATEST_FILE,
                  DATE_FILE
              ],
              check=True
          )

          diff = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if diff.returncode != 0:
              subprocess.run(
                  [
                      "git", "commit", "-m",
                      "Update Fortnite tracker"
                  ],
                  check=True
              )

              pushed = False

              for attempt in range(3):
                  result = subprocess.run(
                      ["git", "push", "origin", "main"]
                  )

                  if result.returncode == 0:
                      pushed = True
                      print("Tracker files pushed successfully.")
                      break

                  print(
                      f"Push failed. Attempt {attempt + 1}/3"
                  )

                  subprocess.run(
                      ["git", "fetch", "origin", "main"],
                      check=True
                  )

                  subprocess.run(
                      ["git", "rebase", "origin/main"],
                      check=True
                  )

                  time.sleep(2)

              if not pushed:
                  raise RuntimeError(
                      "Git push failed after 3 attempts."
                  )

          else:
              print("No file changes to commit.")

          print("Fortnite tracker finished.")
          PY
