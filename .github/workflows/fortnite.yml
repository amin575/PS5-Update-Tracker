name: Fortnite Update Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Fortnite PS5 update
        run: |
          python - <<'PY'
          import requests
          import re

          url = "https://framepatch.app/games/fortnite"

          print("🎮 Fortnite PS5")
          print("Source:", url)
          print()

          r = requests.get(url, timeout=30)

          print("HTTP:", r.status_code)

          if r.status_code != 200:
              print("❌ Failed to fetch Fortnite page")
              raise SystemExit(1)

          html = r.text

          match = re.search(
              r'Patch\s+([0-9.]+)\s*[·•]\s*([0-9.]+\s*(?:GB|MB))',
              html,
              re.IGNORECASE
          )

          if not match:
              print("❌ Could not find Fortnite patch information")
              print(html[:5000])
              raise SystemExit(1)

          version = match.group(1)
          size = match.group(2)

          print()
          print("===== FORTNITE PS5 =====")
          print("Title ID: PPSA01922")
          print("Version:", version)
          print("Size:", size)
          print("========================")
          print()
          print("✅ Fortnite update data found.")
          PY
