name: Fortnite Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PS5 update parser
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ps5-updates requests

      - name: Check Fortnite PS5 update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORTNITE_UPDATE_XML: ${{ secrets.FORTNITE_UPDATE_XML }}

        run: |
          cat > check_fortnite.py <<'PY'
          import os
          import subprocess
          import requests

          from ps5_updates import title as ps5up


          STATE_FILE = "fortnite_version.txt"
          LATEST_FILE = "fortnite_latest.txt"

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]
          UPDATE_XML = os.environ["FORTNITE_UPDATE_XML"]


          if not UPDATE_XML:
              raise RuntimeError(
                  "FORTNITE_UPDATE_XML secret is missing"
              )


          print("========================================")
          print("FORTNITE PS5 UPDATE TRACKER")
          print("========================================")


          print("Loading PSN update XML...")

          title = ps5up.Ps5TitleUpdate.from_url(
              UPDATE_XML
          )

          title.get_update()


          latest = title.latest


          if latest is None:
              raise RuntimeError(
                  "No Fortnite PS5 update package found"
              )


          version = str(
              latest.version
          ).strip()


          system_version = str(
              latest.system_version
          ).strip()


          update_size = str(
              latest.update_size
          ).strip()


          creation_date = str(
              latest.pkg.param.creation_date
          ).strip()


          title_id = str(
              title.title_id
          ).strip()


          content_id = str(
              title.content_id
          ).strip()


          print("Title ID:", title_id)
          print("Content ID:", content_id)
          print("PS5 Version:", version)
          print("Required System:", system_version)
          print("Creation Date:", creation_date)
          print("Update Size:", update_size)


          state = version


          old_state = ""


          if os.path.exists(STATE_FILE):
              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  old_state = f.read().strip()


          latest_text = (
              "PS5 Version: "
              + version
              + "\n"
              "Fortnite Version: "
              + "نامشخص"
              + "\n"
              "Size: "
              + update_size
              + "\n"
              "Required System: "
              + system_version
              + "\n"
              "Release: "
              + creation_date
              + "\n"
          )


          with open(
              LATEST_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(latest_text)


          print(
              "Previous version:",
              old_state if old_state else "None"
          )


          if not old_state:
              print("First run.")

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(state)


          elif old_state != state:

              print("NEW FORTNITE UPDATE DETECTED")


              message = (
                  "🎮 PS5 UPDATE\n\n"
                  "Fortnite\n\n"
                  "PS5 Version: "
                  + version
                  + "\n"
                  "Size: "
                  + update_size
                  + "\n"
                  "Required System: "
                  + system_version
                  + "\n"
                  "Release: "
                  + creation_date
                  + "\n\n"
                  "🆕 Update جدید شناسایی شد"
              )


              telegram_url = (
                  "https://api.telegram.org/bot"
                  + BOT_TOKEN
                  + "/sendMessage"
              )


              response = requests.post(
                  telegram_url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=30
              )


              print(
                  "Telegram:",
                  response.status_code
              )


              if response.status_code != 200:
                  print(response.text)
                  raise RuntimeError(
                      "Telegram notification failed"
                  )


              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(state)


              print("Notification sent.")


          else:
              print("No new Fortnite update.")


          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )


          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )


          subprocess.run(
              [
                  "git",
                  "add",
                  STATE_FILE,
                  LATEST_FILE
              ],
              check=True
          )


          changed = subprocess.run(
              [
                  "git",
                  "diff",
                  "--cached",
                  "--quiet"
              ]
          )


          if changed.returncode != 0:

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update Fortnite tracker"
                  ],
                  check=True
              )


              subprocess.run(
                  [
                      "git",
                      "push",
                      "origin",
                      "main"
                  ],
                  check=True
              )


              print("Files pushed to GitHub.")


          else:
              print("No repository changes.")


          print("Tracker finished.")
          PY

          python3 check_fortnite.py
