name: Fortnite Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Fortnite update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          cat > check_fortnite.py <<'PY'
          import os
          import re
          import subprocess
          import requests

          BUILD_URL = "https://raw.githubusercontent.com/Fortnite-Datamining/Fortnite-Datamining/main/data/meta/build_info.json"

          STATE_FILE = "fortnite_version.txt"
          LATEST_FILE = "fortnite_latest.txt"

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          print("Checking Fortnite...")

          response = requests.get(BUILD_URL, timeout=30)
          response.raise_for_status()

          data = response.json()

          build = str(data.get("build", "")).strip()

          if not build:
              raise RuntimeError("Fortnite build not found")

          print("Build:", build)

          match = re.search(r"Release-([0-9]+(?:\.[0-9]+)+)", build)

          if not match:
              raise RuntimeError("Could not detect Fortnite version")

          game_version = match.group(1)

          print("Fortnite version:", game_version)

          known_ps5_versions = {
              "42.10": "01.000.231",
              "42.20": "01.000.232",
              "42.30": "01.000.233"
          }

          ps5_version = known_ps5_versions.get(
              game_version,
              "نامشخص"
          )

          known_release_dates = {
              "42.10": "2026-09-03",
              "42.20": "2026-09-17",
              "42.30": "2026-10-01"
          }

          release_date = known_release_dates.get(
              game_version,
              "نامشخص"
          )

          update_size = "نامشخص"

          state = game_version + "|" + ps5_version + "|" + release_date

          old_state = ""

          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  old_state = f.read().strip()

          latest_text = (
              "🎮 FORTNITE PS5\n\n"
              "Fortnite Version: " + game_version + "\n"
              "PS5 Version: " + ps5_version + "\n"
              "Release Date: " + release_date + "\n"
              "Update Size: " + update_size + "\n"
          )

          with open(LATEST_FILE, "w", encoding="utf-8") as f:
              f.write(latest_text)

          print("Previous state:", old_state or "None")
          print("Current state:", state)

          if not old_state:
              print("First run. Saving state.")

              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  f.write(state)

          elif old_state != state:
              print("NEW FORTNITE UPDATE DETECTED")

              message = (
                  "🎮 FORTNITE PS5 UPDATE\n\n"
                  "PS5 Version: " + ps5_version + "\n"
                  "Fortnite Version: " + game_version + "\n"
                  "Release Date: " + release_date + "\n"
                  "Update Size: " + update_size + "\n\n"
                  "🆕 Update جدید شناسایی شد"
              )

              telegram_url = (
                  "https://api.telegram.org/bot"
                  + BOT_TOKEN
                  + "/sendMessage"
              )

              telegram_response = requests.post(
                  telegram_url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=30
              )

              print(
                  "Telegram response:",
                  telegram_response.status_code
              )

              if telegram_response.status_code != 200:
                  print(telegram_response.text)
                  raise RuntimeError("Telegram notification failed")

              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  f.write(state)

              print("Notification sent.")

          else:
              print("No new Fortnite update.")

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", STATE_FILE, LATEST_FILE],
              check=True
          )

          changed = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if changed.returncode != 0:
              subprocess.run(
                  ["git", "commit", "-m", "Update Fortnite tracker"],
                  check=True
              )

              for attempt in range(3):
                  push = subprocess.run(
                      ["git", "push", "origin", "main"]
                  )

                  if push.returncode == 0:
                      print("Tracker files pushed successfully.")
                      break

                  print("Push failed. Syncing with origin...")

                  subprocess.run(
                      ["git", "fetch", "origin", "main"],
                      check=True
                  )

                  subprocess.run(
                      ["git", "rebase", "origin/main"],
                      check=True
                  )

              else:
                  raise RuntimeError("Git push failed after 3 attempts.")

          else:
              print("No file changes.")

          print("Fortnite tracker finished.")
          PY

          python3 check_fortnite.py
