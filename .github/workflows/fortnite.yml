name: Fortnite Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: fortnite-update-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Check Fortnite update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import time
          import subprocess
          import requests

          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          # ==========================================
          # Configuration
          # ==========================================

          BUILD_URL = (
              "https://raw.githubusercontent.com/"
              "Fortnite-Datamining/Fortnite-Datamining/"
              "main/data/meta/build_info.json"
          )

          BASE = "https://prosperopatches.com"
          TITLE_ID = "PPSA01922"
          PATCH_PAGE = f"{BASE}/{TITLE_ID}"

          STATE_FILE = "fortnite_version.txt"
          LATEST_FILE = "fortnite_latest.txt"
          DATE_FILE = "fortnite_notification_date.txt"

          BOT_TOKEN = os.environ.get("BOT_TOKEN", "")
          CHAT_ID = os.environ.get("CHAT_ID", "")

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/130.0.0.0 Safari/537.36"
              ),
              "Accept": "application/json, text/plain, */*"
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          VERSION_PATTERN = re.compile(
              r"(?<!\d)0?1\.\d{3}\.\d{1,4}(?!\d)"
          )

          SIZE_PATTERN = re.compile(
              r"(?<![\w.])"
              r"(\d+(?:[.,]\d+)?)\s*"
              r"(GB|MB|TB|GiB|MiB|TiB)"
              r"(?!\w)",
              re.IGNORECASE
          )

          # ==========================================
          # File helpers
          # ==========================================

          def read_file(filename):
              if not os.path.exists(filename):
                  return ""

              with open(filename, "r", encoding="utf-8") as f:
                  return f.read().strip()

          def write_file(filename, content):
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(content)

          # ==========================================
          # Version helpers
          # ==========================================

          def version_key(value):
              numbers = re.findall(r"\d+", str(value or ""))

              if not numbers:
                  return (0,)

              return tuple(int(n) for n in numbers)

          def normalize_version(value):
              numbers = re.findall(r"\d+", str(value or ""))

              if not numbers:
                  return ""

              return ".".join(str(int(n)) for n in numbers)

          def is_newer(candidate, previous):
              return version_key(candidate) > version_key(previous)

          def get_tehran_time():
              return datetime.now(ZoneInfo("Asia/Tehran"))

          # ==========================================
          # Fortnite game version
          # ==========================================

          def get_game_version():
              print("Fetching Fortnite build information...")

              response = session.get(
                  BUILD_URL,
                  timeout=30
              )

              response.raise_for_status()

              data = response.json()
              build = str(data.get("build", "")).strip()

              match = re.search(
                  r"Release-([0-9]+(?:\.[0-9]+)+)",
                  build
              )

              if not match:
                  raise RuntimeError(
                      "Could not identify Fortnite version. "
                      f"Build value: {build}"
                  )

              version = match.group(1)

              print("Fortnite game version:", version)

              return version

          # ==========================================
          # ProsperoPatches browser scraper
          # ==========================================

          def get_ps5_patch():
              print("Opening ProsperoPatches with Chromium...")
              print("Patch page:", PATCH_PAGE)

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox"]
                  )

                  page = browser.new_page(
                      user_agent=HEADERS["User-Agent"],
                      viewport={
                          "width": 1440,
                          "height": 1000
                      }
                  )

                  try:
                      response = page.goto(
                          PATCH_PAGE,
                          wait_until="domcontentloaded",
                          timeout=60000
                      )

                      if response:
                          print(
                              "ProsperoPatches HTTP:",
                              response.status
                          )

                          if response.status >= 400:
                              raise RuntimeError(
                                  "ProsperoPatches page returned HTTP "
                                  + str(response.status)
                              )

                      # Allow the website's JavaScript to load
                      # and render its patch information.
                      try:
                          page.wait_for_load_state(
                              "networkidle",
                              timeout=15000
                          )
                      except Exception:
                          pass

                      page.wait_for_timeout(7000)

                      # Collect the smallest DOM elements containing
                      # both a PS5 version and a size. This helps avoid
                      # pairing one patch's version with another
                      # patch's file size.
                      rows = page.evaluate("""
                      () => {
                        const versionRe =
                          /(?<!\\\\d)0?1\\\\.\\\\d{3}\\\\.\\\\d{1,4}(?!\\\\d)/;

                        const sizeRe =
                          /(?<![\\\\w.])\\\\d+(?:[.,]\\\\d+)?\\\\s*(?:GB|MB|TB|GiB|MiB|TiB)(?!\\\\w)/i;

                        const elements = Array.from(
                          document.querySelectorAll(
                            'tr, [role="row"], li, article, section, div'
                          )
                        );

                        const results = [];

                        for (const element of elements) {
                          const text = (
                            element.innerText || ""
                          ).replace(/\\\\s+/g, " ").trim();

                          if (!text || text.length > 1200) {
                            continue;
                          }

                          if (
                            versionRe.test(text) &&
                            sizeRe.test(text)
                          ) {
                            results.push(text);
                          }
                        }

                        return results.sort(
                          (a, b) => a.length - b.length
                        );
                      }
                      """)

                      # Remove duplicate rows while preserving order.
                      unique_rows = []
                      seen_rows = set()

                      for row in rows:
                          row = re.sub(r"\s+", " ", row).strip()

                          if row and row not in seen_rows:
                              unique_rows.append(row)
                              seen_rows.add(row)

                      patches = []
                      seen_versions = set()

                      for row in unique_rows:
                          versions = VERSION_PATTERN.findall(row)
                          sizes = SIZE_PATTERN.findall(row)

                          if not versions or not sizes:
                              continue

                          # Normally a patch row contains one version
                          # and one size. If a row contains multiple
                          # versions, do not guess which size belongs
                          # to which version.
                          if len(set(versions)) != 1:
                              continue

                          if len(sizes) != 1:
                              continue

                          version = versions[0]
                          number, unit = sizes[0]

                          size = (
                              number.replace(",", ".")
                              + " "
                              + unit.upper()
                          )

                          normalized = normalize_version(version)

                          if normalized in seen_versions:
                              continue

                          seen_versions.add(normalized)

                          patches.append({
                              "version": version,
                              "size": size,
                              "row": row
                          })

                      # Fallback: inspect the full rendered text.
                      # Only use a version if exactly one size occurs
                      # in its surrounding patch block.
                      if not patches:
                          body_text = page.locator(
                              "body"
                          ).inner_text()

                          body_text = re.sub(
                              r"[ \t]+",
                              " ",
                              body_text
                          )

                          matches = list(
                              VERSION_PATTERN.finditer(body_text)
                          )

                          for index, match in enumerate(matches):
                              start = max(0, match.start() - 250)

                              if index + 1 < len(matches):
                                  end = min(
                                      len(body_text),
                                      matches[index + 1].start()
                                  )
                              else:
                                  end = min(
                                      len(body_text),
                                      match.end() + 250
                                  )

                              block = body_text[start:end]
                              sizes = SIZE_PATTERN.findall(block)

                              if len(sizes) != 1:
                                  continue

                              version = match.group(0)
                              number, unit = sizes[0]

                              normalized = normalize_version(version)

                              if normalized in seen_versions:
                                  continue

                              seen_versions.add(normalized)

                              patches.append({
                                  "version": version,
                                  "size": (
                                      number.replace(",", ".")
                                      + " "
                                      + unit.upper()
                                  ),
                                  "row": block
                              })

                      if not patches:
                          preview = page.locator(
                              "body"
                          ).inner_text()[:3000]

                          print(
                              "Rendered page text preview:",
                              preview
                          )

                          raise RuntimeError(
                              "Could not safely extract a matching "
                              "PS5 patch version and size from "
                              "ProsperoPatches. State was not changed."
                          )

                      patches.sort(
                          key=lambda item: version_key(
                              item["version"]
                          ),
                          reverse=True
                      )

                      print(
                          "PS5 patch entries extracted:",
                          len(patches)
                      )

                      for patch in patches[:5]:
                          print(
                              "Patch candidate:",
                              patch["version"],
                              "|",
                              patch["size"]
                          )

                      latest = patches[0]

                      print(
                          "Latest ProsperoPatches PS5 version:",
                          latest["version"]
                      )

                      print(
                          "Latest ProsperoPatches patch size:",
                          latest["size"]
                      )

                      return latest

                  finally:
                      browser.close()

          # ==========================================
          # State handling
          # ==========================================

          def load_state():
              raw = read_file(STATE_FILE)

              if not raw:
                  return None

              try:
                  state = json.loads(raw)

                  if isinstance(state, dict):
                      return state

              except json.JSONDecodeError:
                  pass

              # Legacy format:
              # game_version|ps5_version

              parts = raw.split("|")

              if len(parts) >= 2:
                  return {
                      "game_version": parts[0].strip(),
                      "ps5_version": parts[1].strip(),
                      "patch_date": "",
                      "size": "",
                      "notification_date": ""
                  }

              # Legacy version-only format.

              if re.fullmatch(r"\d+(?:\.\d+)+", raw):
                  return {
                      "game_version": "",
                      "ps5_version": raw,
                      "patch_date": "",
                      "size": "",
                      "notification_date": ""
                  }

              raise RuntimeError(
                  "Unrecognized Fortnite state-file format. "
                  "No state was changed."
              )

          def save_state(state):
              write_file(
                  STATE_FILE,
                  json.dumps(
                      state,
                      ensure_ascii=False,
                      indent=2
                  )
              )

          # ==========================================
          # Telegram
          # ==========================================

          def send_telegram(message):
              if not BOT_TOKEN or not CHAT_ID:
                  raise RuntimeError(
                      "BOT_TOKEN or CHAT_ID secret is missing."
                  )

              url = (
                  "https://api.telegram.org/bot"
                  + BOT_TOKEN
                  + "/sendMessage"
              )

              response = requests.post(
                  url,
                  json={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=30
              )

              print("Telegram HTTP:", response.status_code)

              response.raise_for_status()

              result = response.json()

              if not result.get("ok"):
                  raise RuntimeError(
                      "Telegram rejected the message: "
                      + str(result)
                  )

              print("Telegram notification sent successfully.")

          # ==========================================
          # Latest info file
          # ==========================================

          def make_latest(
              game_version,
              ps5_version,
              size,
              notification_date,
              checked_at
          ):
              return (
                  "🎮 FORTNITE PS5\n\n"
                  f"Fortnite Version: {game_version}\n"
                  f"PS5 Version: {ps5_version}\n"
                  f"Update Size: {size}\n"
                  f"Last Notification Date: {notification_date}\n"
                  f"Last Checked: {checked_at}\n"
                  "Source: ProsperoPatches\n"
              )

          # ==========================================
          # Main
          # ==========================================

          print("Fortnite tracker started.")

          game_version = get_game_version()
          patch = get_ps5_patch()

          source_version = patch["version"]
          source_size = patch["size"]

          old_state = load_state()

          old_game_version = ""
          old_ps5_version = ""

          if old_state:
              old_game_version = str(
                  old_state.get("game_version") or ""
              ).strip()

              old_ps5_version = str(
                  old_state.get("ps5_version") or ""
              ).strip()

          print(
              "Previous game version:",
              old_game_version or "None"
          )

          print(
              "Previous PS5 version:",
              old_ps5_version or "None"
          )

          now = get_tehran_time()
          checked_at = now.strftime("%Y-%m-%d %H:%M:%S")
          today = now.strftime("%Y-%m-%d")

          notification_date = read_file(DATE_FILE)

          if not notification_date and old_state:
              notification_date = str(
                  old_state.get("notification_date") or ""
              ).strip()

          if not notification_date:
              notification_date = "هنوز اعلانی ارسال نشده"

          # ------------------------------------------
          # First run: save baseline, don't notify
          # ------------------------------------------

          if not old_state:
              print(
                  "First run: saving baseline without notification."
              )

              state = {
                  "game_version": game_version,
                  "ps5_version": source_version,
                  "size": source_size,
                  "notification_date": ""
              }

              save_state(state)

              write_file(
                  LATEST_FILE,
                  make_latest(
                      game_version,
                      source_version,
                      source_size,
                      notification_date,
                      checked_at
                  )
              )

          else:
              source_is_older = (
                  bool(old_ps5_version)
                  and version_key(source_version)
                      < version_key(old_ps5_version)
              )

              if source_is_older:
                  print(
                      "WARNING: ProsperoPatches returned an older "
                      "version than the saved state."
                  )

                  print(
                      "Keeping the saved version. "
                      "No notification will be sent."
                  )

                  selected_version = old_ps5_version
                  selected_size = str(
                      old_state.get("size") or "نامشخص"
                  )

              else:
                  selected_version = source_version
                  selected_size = source_size

              new_update = (
                  bool(old_ps5_version)
                  and is_newer(
                      selected_version,
                      old_ps5_version
                  )
              )

              print(
                  "Selected PS5 version:",
                  selected_version
              )

              print(
                  "Selected update size:",
                  selected_size
              )

              print(
                  "New PS5 update detected:",
                  new_update
              )

              if new_update:
                  message = (
                      "🎮 FORTNITE PS5 UPDATE\n\n"
                      f"Fortnite Version: {game_version}\n"
                      f"PS5 Version: {selected_version}\n"
                      f"Update Size: {selected_size}\n"
                      f"Notification Date: {today}\n"
                      "Source: ProsperoPatches\n\n"
                      "🆕 آپدیت جدید PS5 شناسایی شد"
                  )

                  send_telegram(message)

                  notification_date = today
                  write_file(DATE_FILE, notification_date)

              else:
                  print("No newer PS5 patch detected.")

              state = {
                  "game_version": game_version,
                  "ps5_version": selected_version,
                  "size": selected_size,
                  "notification_date": (
                      ""
                      if notification_date == "هنوز اعلانی ارسال نشده"
                      else notification_date
                  )
              }

              save_state(state)

              write_file(
                  LATEST_FILE,
                  make_latest(
                      game_version,
                      selected_version,
                      selected_size,
                      notification_date,
                      checked_at
                  )
              )

          # ==========================================
          # Commit and push
          # ==========================================

          subprocess.run(
              [
                  "git", "config", "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git", "config", "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git", "add",
                  STATE_FILE,
                  LATEST_FILE,
                  DATE_FILE
              ],
              check=True
          )

          diff = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if diff.returncode == 1:
              subprocess.run(
                  [
                      "git", "commit", "-m",
                      "Update Fortnite tracker"
                  ],
                  check=True
              )

              pushed = False

              for attempt in range(3):
                  result = subprocess.run(
                      ["git", "push", "origin", "main"]
                  )

                  if result.returncode == 0:
                      pushed = True
                      print("Tracker files pushed successfully.")
                      break

                  print(
                      f"Push failed. Attempt {attempt + 1}/3"
                  )

                  subprocess.run(
                      ["git", "fetch", "origin", "main"],
                      check=True
                  )

                  subprocess.run(
                      ["git", "rebase", "origin/main"],
                      check=True
                  )

                  time.sleep(2)

              if not pushed:
                  raise RuntimeError(
                      "Git push failed after 3 attempts."
                  )

          elif diff.returncode == 0:
              print("No file changes to commit.")

          else:
              raise RuntimeError(
                  "Could not inspect staged Git changes."
              )

          print("Fortnite tracker finished.")
          PY
