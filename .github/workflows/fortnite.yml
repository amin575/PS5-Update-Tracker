name: Fortnite Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: fortnite-update-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Fortnite update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          python3 - <<'PY'
          import os
          import re
          import html
          import json
          import time
          import subprocess
          import requests

          from datetime import datetime
          from zoneinfo import ZoneInfo

          BUILD_URL = (
              "https://raw.githubusercontent.com/"
              "Fortnite-Datamining/Fortnite-Datamining/"
              "main/data/meta/build_info.json"
          )

          FRAMEPATCH_URL = "https://framepatch.app/games/fortnite"

          STATE_FILE = "fortnite_version.txt"
          LATEST_FILE = "fortnite_latest.txt"
          DATE_FILE = "fortnite_notification_date.txt"

          BOT_TOKEN = os.environ.get("BOT_TOKEN", "")
          CHAT_ID = os.environ.get("CHAT_ID", "")

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; PS5UpdateTracker/1.0)"
              )
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def read_file(filename):
              if not os.path.exists(filename):
                  return ""

              with open(filename, "r", encoding="utf-8") as f:
                  return f.read().strip()

          def write_file(filename, content):
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(content)

          def version_key(version):
              numbers = re.findall(r"\d+", str(version or ""))
              return tuple(int(n) for n in numbers) if numbers else (0,)

          def version_is_newer(candidate, previous):
              return version_key(candidate) > version_key(previous)

          def clean_html(content):
              content = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  content,
                  flags=re.IGNORECASE | re.DOTALL
              )

              content = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  content,
                  flags=re.IGNORECASE | re.DOTALL
              )

              content = re.sub(r"<[^>]+>", " ", content)

              return re.sub(
                  r"\s+",
                  " ",
                  html.unescape(content)
              ).strip()

          def get_game_version():
              print("Fetching Fortnite build information...")

              response = session.get(BUILD_URL, timeout=30)
              response.raise_for_status()

              data = response.json()
              build = str(data.get("build", "")).strip()

              match = re.search(
                  r"Release-([0-9]+(?:\.[0-9]+)+)",
                  build
              )

              if not match:
                  raise RuntimeError(
                      "Could not identify Fortnite version: " + build
                  )

              version = match.group(1)

              print("Fortnite game version:", version)

              return version

          def get_ps5_patch():
              print("Fetching PS5 patch history...")

              response = session.get(
                  FRAMEPATCH_URL,
                  timeout=30
              )
              response.raise_for_status()

              page = clean_html(response.text)

              # FramePatch patch history uses entries similar to:
              # Patch 01.000.228 · 74.2 GB
              pattern = re.compile(
                  r"Patch\s+"
                  r"(01\.\d{3}\.\d{3})"
                  r"\s*[·•\-–]\s*"
                  r"([\d.]+)\s*GB",
                  flags=re.IGNORECASE
              )

              matches = pattern.findall(page)

              if not matches:
                  # Log a useful excerpt if the page format changes.
                  location = page.lower().find("patch history")

                  if location >= 0:
                      print(
                          "Patch history excerpt:",
                          page[location:location + 1200]
                      )
                  else:
                      print("Could not find patch history in page.")

                  raise RuntimeError(
                      "Could not extract PS5 patch version and size."
                  )

              # The page lists newest patch first.
              patch_version, patch_size = matches[0]

              print("FramePatch PS5 version:", patch_version)
              print("FramePatch patch size:", patch_size + " GB")

              return patch_version, patch_size + " GB"

          def load_state():
              raw = read_file(STATE_FILE)

              if not raw:
                  return None

              # Current format: game_version|ps5_version
              parts = raw.split("|")

              if len(parts) >= 2:
                  game_version = parts[0].strip()
                  ps5_version = parts[1].strip()

                  if re.fullmatch(
                      r"\d+(?:\.\d+)+",
                      game_version
                  ):
                      return {
                          "game_version": game_version,
                          "ps5_version": ps5_version
                      }

              # Also support older state files containing only a version.
              if re.fullmatch(r"\d+(?:\.\d+)+", raw):
                  return {
                      "game_version": "",
                      "ps5_version": raw
                  }

              return None

          def make_latest(
              game_version,
              ps5_version,
              notification_date,
              update_size
          ):
              return (
                  "🎮 FORTNITE PS5\n\n"
                  f"Fortnite Version: {game_version}\n"
                  f"PS5 Version: {ps5_version}\n"
                  f"Last Notification Date: {notification_date}\n"
                  f"Update Size: {update_size}\n"
              )

          def save_state(game_version, ps5_version):
              write_file(
                  STATE_FILE,
                  f"{game_version}|{ps5_version}"
              )

          print("Fortnite tracker started.")

          # 1. Read the current game version.
          game_version = get_game_version()

          # 2. Read the latest PS5 patch and its reported size.
          source_ps5_version, source_size = get_ps5_patch()

          # 3. Load previously saved information.
          old_state = load_state()

          if old_state:
              old_game_version = old_state["game_version"]
              old_ps5_version = old_state["ps5_version"]
          else:
              old_game_version = ""
              old_ps5_version = ""

          print("Previous game version:", old_game_version or "None")
          print("Previous PS5 version:", old_ps5_version or "None")

          # 4. Never downgrade the saved PS5 patch because a source
          # temporarily displays an older patch.
          if (
              old_ps5_version
              and old_ps5_version != "نامشخص"
              and version_key(source_ps5_version)
                  < version_key(old_ps5_version)
          ):
              print(
                  "WARNING: FramePatch is older than the saved PS5 "
                  "version. Keeping the saved version."
              )

              ps5_version = old_ps5_version
              update_size = "نامشخص"

          else:
              ps5_version = source_ps5_version
              update_size = source_size

          print("Selected PS5 version:", ps5_version)
          print("Selected update size:", update_size)

          # 5. Read the last successful notification date.
          last_notification_date = read_file(DATE_FILE)

          if not last_notification_date:
              last_notification_date = "هنوز اعلانی ارسال نشده"

          tehran_now = datetime.now(ZoneInfo("Asia/Tehran"))
          today = tehran_now.strftime("%Y-%m-%d")

          # 6. Establish a baseline on the first run.
          if not old_state:
              print("First run: establishing baseline without notification.")

              save_state(game_version, ps5_version)

              write_file(
                  LATEST_FILE,
                  make_latest(
                      game_version,
                      ps5_version,
                      last_notification_date,
                      update_size
                  )
              )

          else:
              # Notify only when a newer PS5 patch is detected.
              new_update = version_is_newer(
                  ps5_version,
                  old_ps5_version
              ) if old_ps5_version else False

              print("New PS5 update detected:", new_update)

              if new_update:
                  if not BOT_TOKEN or not CHAT_ID:
                      raise RuntimeError(
                          "BOT_TOKEN or CHAT_ID secret is missing."
                      )

                  message = (
                      "🎮 FORTNITE PS5 UPDATE\n\n"
                      f"Fortnite Version: {game_version}\n"
                      f"PS5 Version: {ps5_version}\n"
                      f"Notification Date: {today}\n"
                      f"Update Size: {update_size}\n\n"
                      "🆕 آپدیت جدید PS5 شناسایی شد"
                  )

                  telegram_url = (
                      f"https://api.telegram.org/bot"
                      f"{BOT_TOKEN}/sendMessage"
                  )

                  response = requests.post(
                      telegram_url,
                      json={
                          "chat_id": CHAT_ID,
                          "text": message
                      },
                      timeout=30
                  )

                  print("Telegram HTTP:", response.status_code)
                  response.raise_for_status()

                  result = response.json()

                  if not result.get("ok"):
                      raise RuntimeError(
                          "Telegram did not confirm the notification."
                      )

                  # Update notification date only after Telegram confirms.
                  last_notification_date = today

                  write_file(DATE_FILE, today)

                  print("Notification sent successfully.")

              else:
                  print("No newer PS5 patch detected.")

              # Save the latest game version and selected PS5 patch.
              save_state(game_version, ps5_version)

              write_file(
                  LATEST_FILE,
                  make_latest(
                      game_version,
                      ps5_version,
                      last_notification_date,
                      update_size
                  )
              )

          # 7. Commit tracker files.
          subprocess.run(
              [
                  "git", "config", "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git", "config", "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git", "add",
                  STATE_FILE,
                  LATEST_FILE,
                  DATE_FILE
              ],
              check=True
          )

          changed = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if changed.returncode != 0:
              subprocess.run(
                  [
                      "git", "commit", "-m",
                      "Update Fortnite tracker"
                  ],
                  check=True
              )

              pushed = False

              for attempt in range(3):
                  result = subprocess.run(
                      ["git", "push", "origin", "main"]
                  )

                  if result.returncode == 0:
                      pushed = True
                      print("Tracker files pushed successfully.")
                      break

                  print(
                      f"Push failed; syncing. Attempt "
                      f"{attempt + 1}/3"
                  )

                  subprocess.run(
                      ["git", "fetch", "origin", "main"],
                      check=True
                  )

                  subprocess.run(
                      ["git", "rebase", "origin/main"],
                      check=True
                  )

                  time.sleep(2)

              if not pushed:
                  raise RuntimeError(
                      "Could not push tracker files after 3 attempts."
                  )

          else:
              print("No file changes to commit.")

          print("Fortnite tracker finished.")
          PY
