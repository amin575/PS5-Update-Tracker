name: Fortnite Update Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Fortnite PS5
        run: |
          python -m pip install --upgrade pip
          pip install ps5-updates

          python - <<'PY'
          from ps5_updates import title as ps5up

          title_id = "PPSA01922"

          print("🎮 Fortnite PS5")
          print("Title ID:", title_id)
          print()

          # Known PS5 version.xml URL format.
          # This test checks whether a direct title endpoint is available.
          urls = [
              f"https://sgst.prod.dl.playstation.net/sgst/prod/00/np/{title_id}_00/",
              f"https://sgst.prod.dl.playstation.net/sgst/prod/00/np/{title_id}/"
          ]

          for url in urls:
              print("Trying:", url)

              try:
                  title = ps5up.Ps5TitleUpdate.from_url(url)
                  title.get_update()

                  print()
                  print("===== RESULT =====")
                  print("Title ID:", title.title_id)
                  print("Content ID:", title.content_id)

                  if title.latest:
                      print("Name:", title.latest.pkg.param.name)
                      print("Version:", title.latest.version)
                      print("Size:", title.latest.update_size)
                      print("System Version:", title.latest.system_version)

                  print("===== END RESULT =====")
                  break

              except Exception as e:
                  print("Error:", type(e).__name__, str(e))
                  print()

          print("Test finished.")
          PY
