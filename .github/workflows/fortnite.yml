name: Fortnite Update Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Fortnite PS5
        run: |
          python - <<'PY'
          import requests
          import urllib3

          urllib3.disable_warnings()

          title_id = "PPSA01922"

          print("🎮 Fortnite PS5")
          print("Title ID:", title_id)
          print()

          search_urls = [
              f"https://sgst.prod.dl.playstation.net/sgst/prod/00/np/{title_id}_00/",
              f"https://sgst.prod.dl.playstation.net/sgst/prod/00/np/{title_id}/"
          ]

          for url in search_urls:
              print("Trying:", url)

              try:
                  r = requests.get(
                      url,
                      timeout=20,
                      verify=False
                  )

                  print("HTTP:", r.status_code)
                  print("Size:", len(r.content))
                  print()

                  if r.status_code == 200:
                      print("===== RESPONSE =====")
                      print(r.text[:10000])
                      print("===== END RESPONSE =====")
                      break

              except Exception as e:
                  print("Error:", e)

          print()
          print("Test finished.")
          PY
