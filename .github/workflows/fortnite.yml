name: Fortnite Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: fortnite-update-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Fortnite update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          python3 - <<'PY'
          import os
          import re
          import html
          import json
          import time
          import subprocess
          from datetime import datetime
          from urllib.parse import quote_plus
          from zoneinfo import ZoneInfo

          import requests

          BUILD_URL = (
              "https://raw.githubusercontent.com/"
              "Fortnite-Datamining/Fortnite-Datamining/"
              "main/data/meta/build_info.json"
          )

          FRAMEPATCH_URL = "https://framepatch.app/games/fortnite"

          STATE_FILE = "fortnite_version.txt"
          LATEST_FILE = "fortnite_latest.txt"
          DATE_FILE = "fortnite_notification_date.txt"

          BOT_TOKEN = os.environ.get("BOT_TOKEN", "")
          CHAT_ID = os.environ.get("CHAT_ID", "")

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; PS5UpdateTracker/1.0)"
          }

          # Known game-version to PS5-version mappings.
          # For newer versions, the script also searches online sources.
          KNOWN_PS5_VERSIONS = {
              "42.10": "01.000.231",
              "42.20": "01.000.232",
              "42.30": "01.000.233",
          }

          def get_page(url):
              response = requests.get(
                  url,
                  headers=HEADERS,
                  timeout=30
              )
              response.raise_for_status()
              return response.text

          def clean_html(content):
              content = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  content,
                  flags=re.IGNORECASE | re.DOTALL
              )
              content = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  content,
                  flags=re.IGNORECASE | re.DOTALL
              )
              content = re.sub(r"<[^>]+>", " ", content)
              return re.sub(r"\s+", " ", html.unescape(content))

          def find_ps5_version(game_version):
              # Try to discover the console patch for this exact game version.
              search_url = (
                  "https://mp1st.com/?s="
                  + quote_plus("Fortnite Update " + game_version)
              )

              try:
                  page = clean_html(get_page(search_url))

                  for match in re.finditer(
                      re.escape(game_version),
                      page,
                      flags=re.IGNORECASE
                  ):
                      start = max(0, match.start() - 150)
                      end = min(len(page), match.end() + 800)
                      section = page[start:end]

                      patch = re.search(
                          r"1\.000\.\d{3}",
                          section
                      )

                      if patch and "Fortnite" in section:
                          print(
                              "PS5 version found online:",
                              patch.group(0)
                          )
                          return patch.group(0)

              except Exception as error:
                  print("Online PS5 version lookup failed:", error)

              # Use a known mapping if the online lookup does not work.
              fallback = KNOWN_PS5_VERSIONS.get(game_version)

              if fallback:
                  print("Using known PS5 version:", fallback)
                  return fallback

              return "نامشخص"

          def find_update_size(ps5_version):
              if ps5_version == "نامشخص":
                  return "نامشخص"

              try:
                  page = clean_html(get_page(FRAMEPATCH_URL))

                  # Use a size only when the source reports the exact
                  # PS5 patch version currently being tracked.
                  patches = re.findall(
                      r"Patch\s+(01\.\d{3}\.\d{3})"
                      r"\s*[·•\-–]\s*([\d.]+\s*GB)",
                      page,
                      flags=re.IGNORECASE
                  )

                  for version, size in patches:
                      if version == ps5_version:
                          print("Verified matching patch size:", size)
                          return size.replace(" ", "")

                  print(
                      "No matching PS5 patch size found. "
                      "Not using a size from an older patch."
                  )

              except Exception as error:
                  print("Patch size lookup failed:", error)

              return "نامشخص"

          def read_file(filename):
              if not os.path.exists(filename):
                  return ""

              with open(filename, "r", encoding="utf-8") as file:
                  return file.read().strip()

          def write_file(filename, content):
              with open(filename, "w", encoding="utf-8") as file:
                  file.write(content)

          print("Checking Fortnite sources...")

          # 1. Fetch the current Fortnite game version.
          try:
              response = requests.get(
                  BUILD_URL,
                  headers=HEADERS,
                  timeout=30
              )
              response.raise_for_status()
              data = response.json()

          except Exception as error:
              raise RuntimeError(
                  "Could not retrieve Fortnite build information: "
                  + str(error)
              )

          build = str(data.get("build", "")).strip()

          version_match = re.search(
              r"Release-([0-9]+(?:\.[0-9]+)+)",
              build
          )

          if not version_match:
              raise RuntimeError(
                  "Could not detect the Fortnite game version from: "
                  + build
              )

          game_version = version_match.group(1)

          print("Fortnite game version:", game_version)

          # 2. Fetch the PS5 patch version and its size when available.
          ps5_version = find_ps5_version(game_version)
          update_size = find_update_size(ps5_version)

          print("PS5 version:", ps5_version)
          print("Update size:", update_size)

          # 3. Read the previously tracked version.
          old_state = read_file(STATE_FILE)
          old_parts = old_state.split("|")

          old_game_version = ""
          old_ps5_version = ""

          if len(old_parts) >= 2:
              old_game_version = old_parts[0].strip()
              old_ps5_version = old_parts[1].strip()

          valid_old_state = bool(
              re.fullmatch(
                  r"\d+(?:\.\d+)+",
                  old_game_version
              )
          )

          # 4. Keep the last notification date until another notification
          # is successfully sent.
          last_notification_date = read_file(DATE_FILE)

          if not last_notification_date:
              last_notification_date = "هنوز اعلانی ارسال نشده"

          tehran_now = datetime.now(
              ZoneInfo("Asia/Tehran")
          )

          today = tehran_now.strftime("%Y-%m-%d")

          # Do not treat an unknown-to-known PS5 version lookup as a
          # separate update when the Fortnite game version is unchanged.
          new_update = False

          if valid_old_state:
              if old_game_version != game_version:
                  new_update = True

              elif (
                  old_ps5_version != "نامشخص"
                  and ps5_version != "نامشخص"
                  and old_ps5_version != ps5_version
              ):
                  new_update = True

          print("Previous state:", old_state or "None")
          print(
              "Current state:",
              game_version + "|" + ps5_version
          )
          print("New update detected:", new_update)

          # Prepare the latest information shown by /updates.
          def make_latest(date_text):
              return (
                  "🎮 FORTNITE PS5\n\n"
                  "Fortnite Version: " + game_version + "\n"
                  "PS5 Version: " + ps5_version + "\n"
                  "Last Notification Date: " + date_text + "\n"
                  "Update Size: " + update_size + "\n"
              )

          # First run: establish a baseline without sending a false alert.
          if not valid_old_state:
              print("Initializing Fortnite tracker; no alert on baseline.")

              write_file(
                  STATE_FILE,
                  game_version + "|" + ps5_version
              )

              write_file(
                  LATEST_FILE,
                  make_latest(last_notification_date)
              )

          elif new_update:
              print("NEW FORTNITE UPDATE DETECTED!")

              if not BOT_TOKEN or not CHAT_ID:
                  raise RuntimeError(
                      "BOT_TOKEN or CHAT_ID secret is missing."
                  )

              # The date is the day this notification is sent,
              # in Tehran time. It stays unchanged until the next alert.
              notification_date = today

              message = (
                  "🎮 FORTNITE PS5 UPDATE\n\n"
                  "Fortnite Version: " + game_version + "\n"
                  "PS5 Version: " + ps5_version + "\n"
                  "Notification Date: " + notification_date + "\n"
                  "Update Size: " + update_size + "\n\n"
                  "🆕 آپدیت جدید شناسایی شد"
              )

              telegram_url = (
                  "https://api.telegram.org/bot"
                  + BOT_TOKEN
                  + "/sendMessage"
              )

              telegram_response = requests.post(
                  telegram_url,
                  json={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=30
              )

              print(
                  "Telegram status:",
                  telegram_response.status_code
              )

              if not telegram_response.ok:
                  print(telegram_response.text)
                  raise RuntimeError(
                      "Telegram notification failed; state not saved."
                  )

              telegram_result = telegram_response.json()

              if not telegram_result.get("ok"):
                  raise RuntimeError(
                      "Telegram did not confirm the notification."
                  )

              # Save the new version and date only after Telegram succeeds.
              write_file(
                  STATE_FILE,
                  game_version + "|" + ps5_version
              )

              write_file(
                  DATE_FILE,
                  notification_date
              )

              write_file(
                  LATEST_FILE,
                  make_latest(notification_date)
              )

              print("Notification sent and date saved:", notification_date)

          else:
              print("No new Fortnite update.")

              # Keep the last notification date unchanged.
              write_file(
                  STATE_FILE,
                  game_version + "|" + ps5_version
              )

              write_file(
                  LATEST_FILE,
                  make_latest(last_notification_date)
              )

          # 5. Commit the updated files to GitHub.
          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", STATE_FILE, LATEST_FILE, DATE_FILE],
              check=True
          )

          changed = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if changed.returncode != 0:
              subprocess.run(
                  ["git", "commit", "-m", "Update Fortnite tracker"],
                  check=True
              )

              pushed = False

              for attempt in range(3):
                  push = subprocess.run(
                      ["git", "push", "origin", "main"]
                  )

                  if push.returncode == 0:
                      print("Tracker files pushed successfully.")
                      pushed = True
                      break

                  print(
                      "Push failed. Syncing with origin. Attempt:",
                      attempt + 1
                  )

                  subprocess.run(
                      ["git", "fetch", "origin", "main"],
                      check=True
                  )

                  subprocess.run(
                      ["git", "rebase", "origin/main"],
                      check=True
                  )

                  time.sleep(2)

              if not pushed:
                  raise RuntimeError(
                      "Git push failed after 3 attempts."
                  )

          else:
              print("No file changes to commit.")

          print("Fortnite tracker finished.")
          PY
