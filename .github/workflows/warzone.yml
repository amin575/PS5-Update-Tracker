name: Warzone API Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Find Prospero API
        run: |
          python - <<'PY'
          import requests
          import re
          from urllib.parse import urljoin

          url = "https://prosperopatches.com/PPSA01649"

          print("🎮 Warzone PS5")
          print("Page:", url)
          print()

          r = requests.get(
              url,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("HTTP:", r.status_code)
          print("HTML size:", len(r.text))
          print()

          html = r.text

          print("===== SCRIPT FILES =====")

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.IGNORECASE
          )

          if not scripts:
              print("No external JavaScript files found.")
          else:
              for src in scripts:
                  full_url = urljoin(url, src)
                  print(full_url)

          print()
          print("===== API / JSON REFERENCES =====")

          patterns = [
              r'https?://[^"\']+',
              r'["\']([^"\']*(?:api|json|patch|update)[^"\']*)["\']'
          ]

          found = set()

          for pattern in patterns:
              matches = re.findall(
                  pattern,
                  html,
                  re.IGNORECASE
              )

              for item in matches:
                  if isinstance(item, tuple):
                      item = item[0]

                  if any(x in item.lower() for x in [
                      "api",
                      "json",
                      "patch",
                      "update"
                  ]):
                      found.add(item)

          if found:
              for item in sorted(found):
                  print(item)
          else:
              print("No obvious API references found.")

          print()
          print("===== IMPORTANT PAGE TEXT =====")

          for keyword in [
              "Loading patches",
              "fetch(",
              "axios",
              "/api/",
              ".json",
              "patches"
          ]:
              pos = html.lower().find(keyword.lower())

              if pos != -1:
                  print()
                  print("Keyword:", keyword)
                  print(html[max(0, pos - 500):pos + 1500])

          print()
          print("===== TEST FINISHED =====")
          PY
