name: Warzone API Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Extract loadpatches request
        run: |
          python - <<'PY'
          import requests
          import re

          js_url = "https://prosperopatches.com/assets/js/titleview.js?v=1709144554"

          r = requests.get(
              js_url,
              timeout=30,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          print("🎮 Warzone PS5")
          print("HTTP:", r.status_code)
          print("JS size:", len(r.text))
          print()

          js = r.text

          print("===== LOADPATCHES CODE =====")

          positions = [
              m.start()
              for m in re.finditer(
                  r'/loadpatches',
                  js,
                  re.IGNORECASE
              )
          ]

          print("Found:", len(positions))
          print()

          for i, pos in enumerate(positions):
              print("----- MATCH", i + 1, "-----")
              print(
                  js[
                      max(0, pos - 2500):
                      min(len(js), pos + 3000)
                  ]
              )
              print()

          print("===== DONE =====")
          PY
