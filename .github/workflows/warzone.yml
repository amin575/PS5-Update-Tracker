name: Warzone API Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Find Prospero API request
        run: |
          python - <<'PY'
          import requests
          import re

          js_url = "https://prosperopatches.com/assets/js/titleview.js?v=1709144554"

          print("🎮 Warzone PS5")
          print("Downloading titleview.js...")
          print()

          r = requests.get(
              js_url,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("HTTP:", r.status_code)
          print("JS size:", len(r.text))
          print()

          if r.status_code != 200:
              print("❌ Could not download titleview.js")
              raise SystemExit(1)

          js = r.text

          print("===== API REFERENCES =====")

          patterns = [
              r'/api/internal[^"\']*',
              r'apiUri[^;]*',
              r'\.ajax\([^)]*\)',
              r'\$\.get\([^)]*\)',
              r'\$\.post\([^)]*\)',
              r'fetch\([^)]*\)',
              r'axios[^;]*'
          ]

          found = False

          for pattern in patterns:
              matches = re.findall(
                  pattern,
                  js,
                  re.IGNORECASE | re.DOTALL
              )

              if matches:
                  print()
                  print("PATTERN:", pattern)

                  for match in matches[:20]:
                      print(match[:2000])

                  found = True

          print()
          print("===== SEARCH AROUND 'patch' =====")

          for keyword in [
              "patch",
              "title",
              "apiUri",
              "lastupdated",
              "patch-container"
          ]:
              positions = [
                  m.start()
                  for m in re.finditer(
                      re.escape(keyword),
                      js,
                      re.IGNORECASE
                  )
              ]

              if positions:
                  print()
                  print("KEYWORD:", keyword)

                  for pos in positions[:5]:
                      print(js[max(0, pos - 500):pos + 1500])

          if not found:
              print()
              print("❌ No API request pattern found.")

          print()
          print("===== TEST FINISHED =====")
          PY
