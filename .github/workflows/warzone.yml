name: Warzone API Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Test Prospero loadpatches API
        run: |
          python - <<'PY'
          import requests
          import json

          API = "https://prosperopatches.com/api/internal/loadpatches"

          data = {
              "titleid": "PPSA07950",
              "key": "db36a93c8bdfcc99c6c0170671c3b49d75a9873eb3c634fde0ab26392353a299"
          }

          print("🎮 Warzone PS5")
          print("Testing Prospero API...")
          print()
          print("API:", API)
          print("Title ID:", data["titleid"])
          print()

          r = requests.post(
              API,
              data=data,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "X-Requested-With": "XMLHttpRequest",
                  "Referer": "https://prosperopatches.com/PPSA07950"
              }
          )

          print("HTTP:", r.status_code)
          print("Response size:", len(r.text))
          print()

          print("===== API RESPONSE =====")
          print(r.text)
          print()
          print("===== TEST FINISHED =====")
          PY
