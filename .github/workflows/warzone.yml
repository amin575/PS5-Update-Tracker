name: Warzone API Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Test Prospero API exactly
        run: |
          python - <<'PY'
          import requests
          import json

          BASE = "https://prosperopatches.com"
          PAGE = BASE + "/PPSA07950"
          API = BASE + "/api/internal/loadpatches"

          titleid = "PPSA07950"
          key = "db36a93c8bdfcc99c6c0170671c3b49d75a9873eb3c634fde0ab26392353a299"

          session = requests.Session()

          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          })

          print("🎮 Warzone PS5")
          print("Opening page...")
          print()

          page = session.get(
              PAGE,
              timeout=30
          )

          print("Page HTTP:", page.status_code)
          print("Cookies:", session.cookies.get_dict())
          print()

          if page.status_code != 200:
              raise SystemExit("Could not open Prospero page")

          payload = {
              "titleid": titleid,
              "key": key
          }

          body = json.dumps(payload)

          print("===== REQUEST =====")
          print("URL:", API)
          print("Method: POST")
          print("Content-Type: application/x-www-form-urlencoded; charset=UTF-8")
          print("Body:", body)
          print()

          response = session.post(
              API,
              data=body,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                  "Accept": "application/json",
                  "Referer": PAGE,
                  "Origin": BASE,
                  "X-Requested-With": "XMLHttpRequest"
              }
          )

          print("===== RESPONSE =====")
          print("HTTP:", response.status_code)
          print("Size:", len(response.text))
          print()
          print(response.text)
          print()
          print("===== DONE =====")
          PY
