name: Warzone Update Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Find Warzone PS5 data
        run: |
          python - <<'PY'
          import requests
          import re

          url = "https://www.prosperopatches.com/"

          print("🎮 Warzone PS5")
          print("Checking ProsperoPatches...")
          print()

          r = requests.get(url, timeout=30)

          print("HTTP:", r.status_code)

          if r.status_code != 200:
              print("❌ Could not access ProsperoPatches")
              raise SystemExit(1)

          html = r.text

          print("Page size:", len(html))
          print()

          # Look for Warzone references
          patterns = [
              r'Warzone',
              r'PPSA[0-9]+',
              r'PPSA-[0-9]+'
          ]

          found = False

          for pattern in patterns:
              matches = re.findall(
                  pattern,
                  html,
                  re.IGNORECASE
              )

              if matches:
                  print("Found:", pattern)
                  print(matches[:20])
                  found = True

          if not found:
              print("❌ Warzone data was not present in the initial page.")
              print()
              print("ProsperoPatches uses dynamic database loading.")
              print("The direct page did not expose the game data.")

          print()
          print("Test finished.")
          PY
