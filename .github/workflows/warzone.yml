name: Warzone Update Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: warzone-update-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Warzone update
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import re
          import subprocess
          import requests

          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          BASE = "https://prosperopatches.com"
          PAGE = BASE + "/PPSA07950"
          API = BASE + "/api/internal/loadpatches"

          TITLE_ID = "PPSA07950"
          KEY = "db36a93c8bdfcc99c6c0170671c3b49d75a9873eb3c634fde0ab26392353a299"

          STATE_FILE = "warzone_version.txt"
          LATEST_FILE = "warzone_latest.txt"

          BOT_TOKEN = os.environ.get("BOT_TOKEN", "")
          CHAT_ID = os.environ.get("CHAT_ID", "")

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json, text/plain, */*"
          })

          def read_file(filename):
              if not os.path.exists(filename):
                  return ""

              with open(filename, "r", encoding="utf-8") as f:
                  return f.read().strip()

          def write_file(filename, content):
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(content)

          def parse_date(value):
              if not value:
                  return datetime.min.replace(tzinfo=timezone.utc)

              value = str(value).strip()

              try:
                  parsed = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )

                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)

                  return parsed.astimezone(timezone.utc)

              except (ValueError, TypeError):
                  pass

              for fmt in (
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M",
                  "%Y-%m-%d"
              ):
                  try:
                      return datetime.strptime(
                          value, fmt
                      ).replace(tzinfo=timezone.utc)
                  except ValueError:
                      continue

              return datetime.min.replace(tzinfo=timezone.utc)

          def version_key(value):
              numbers = re.findall(r"\d+", str(value or ""))
              return tuple(int(n) for n in numbers) if numbers else (0,)

          def normalize_size(value):
              if value is None or value == "":
                  return "نامشخص"

              if isinstance(value, str):
                  value = value.strip()
                  if not value:
                      return "نامشخص"

                  if re.search(r"[a-zA-Z]", value):
                      return value

              try:
                  number = float(value)

                  if number >= 1_000_000_000:
                      return f"{number / 1_000_000_000:.1f} GB"

                  return str(value)

              except (ValueError, TypeError):
                  return str(value)

          def load_state():
              raw = read_file(STATE_FILE)

              if not raw:
                  return None, None

              try:
                  parsed = json.loads(raw)

                  if isinstance(parsed, dict):
                      return parsed, "json"

              except json.JSONDecodeError:
                  pass

              # Old versions of this tracker saved only the version.
              return {
                  "version": raw,
                  "import_date": "",
                  "size": "",
                  "firmware": "",
                  "notification_date": ""
              }, "legacy"

          def get_patches():
              print("Opening Prospero page:", PAGE)

              page_response = session.get(
                  PAGE,
                  timeout=30
              )

              print("Page HTTP:", page_response.status_code)
              page_response.raise_for_status()

              # Preserve the original request format.
              payload = {
                  "titleid": TITLE_ID,
                  "key": KEY
              }

              response = session.post(
                  API,
                  data=json.dumps(payload),
                  timeout=30,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                      "Accept": "application/json",
                      "Referer": PAGE,
                      "Origin": BASE,
                      "X-Requested-With": "XMLHttpRequest"
                  }
              )

              print("API HTTP:", response.status_code)

              if response.status_code != 200:
                  print(response.text[:1500])
                  raise RuntimeError("Warzone API request failed")

              try:
                  data = response.json()
              except ValueError:
                  print(response.text[:1500])
                  raise RuntimeError("Warzone API returned invalid JSON")

              if not isinstance(data, dict):
                  raise RuntimeError("Unexpected API response structure")

              if not data.get("success"):
                  print("API response:", data)
                  raise RuntimeError(
                      "Warzone API rejected the request: "
                      + str(data.get("message", "Unknown error"))
                  )

              patches = data.get("patches", [])

              if not isinstance(patches, list) or not patches:
                  print("API response:", data)
                  raise RuntimeError("No Warzone patches found")

              return patches

          print("Warzone PS5 tracker started")

          patches = get_patches()

          valid_patches = [
              p for p in patches
              if isinstance(p, dict)
              and p.get("content_ver") is not None
              and str(p.get("content_ver")).strip()
          ]

          if not valid_patches:
              raise RuntimeError("No patches with a valid version found")

          # Select newest by import date, then version as a tie-breaker.
          valid_patches.sort(
              key=lambda p: (
                  parse_date(p.get("import_date")),
                  version_key(p.get("content_ver"))
              ),
              reverse=True
          )

          latest = valid_patches[0]

          version = str(latest.get("content_ver")).strip()
          raw_size = latest.get("filesize")
          size = normalize_size(raw_size)
          firmware = str(
              latest.get("required_firmware") or "نامشخص"
          ).strip()
          import_date = str(
              latest.get("import_date") or "نامشخص"
          ).strip()

          if not version:
              raise RuntimeError("Latest patch has no version")

          print()
          print("Latest Warzone patch:")
          print("Version:", version)
          print("Size:", size)
          print("Required firmware:", firmware)
          print("Import date:", import_date)
          print("Patches returned:", len(valid_patches))
          print()

          old_state, state_format = load_state()

          if old_state:
              print("Previous version:", old_state.get("version"))
              print("State format:", state_format)
          else:
              print("No previous state found")

          today = datetime.now(
              ZoneInfo("Asia/Tehran")
          ).strftime("%Y-%m-%d")

          if old_state:
              old_version = str(
                  old_state.get("version") or ""
              ).strip()
              old_import_date = str(
                  old_state.get("import_date") or ""
              ).strip()
              old_size = str(
                  old_state.get("size") or ""
              ).strip()
          else:
              old_version = ""
              old_import_date = ""
              old_size = ""

          def signature(ver, imp_date, file_size):
              if imp_date:
                  return ver + "|" + imp_date
              return ver + "|" + file_size

          current_signature = signature(
              version, import_date, str(raw_size or "")
          )

          old_signature = ""

          if old_version:
              old_signature = signature(
                  old_version,
                  old_import_date,
                  old_size
              )

          is_new_update = False

          if not old_state:
              print("First run: saving baseline without notification")

          elif state_format == "legacy":
              # Migrate old state without a false alert if the version
              # has not changed. Notify if the actual version differs.
              if old_version != version:
                  is_new_update = True
              else:
                  print("Migrating legacy state without an alert")

          elif old_signature != current_signature:
              is_new_update = True

          print("Current signature:", current_signature)
          print("Previous signature:", old_signature or "None")
          print("New update detected:", is_new_update)

          old_notification_date = (
              old_state.get("notification_date", "")
              if old_state else ""
          )

          if is_new_update:
              if not BOT_TOKEN or not CHAT_ID:
                  raise RuntimeError(
                      "BOT_TOKEN or CHAT_ID secret is missing"
                  )

              notification_date = today

              message = (
                  "🎮 PS5 UPDATE\n\n"
                  "Call of Duty: Warzone\n\n"
                  f"Version: {version}\n"
                  f"Size: {size}\n"
                  f"Required Firmware: {firmware}\n"
                  f"Patch Added: {import_date}\n"
                  f"Notification Date: {notification_date}\n\n"
                  "🆕 آپدیت جدید شناسایی شد"
              )

              telegram_url = (
                  f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              )

              telegram_response = requests.post(
                  telegram_url,
                  json={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=30
              )

              print("Telegram HTTP:", telegram_response.status_code)

              if not telegram_response.ok:
                  print(telegram_response.text)
                  raise RuntimeError("Telegram notification failed")

              telegram_result = telegram_response.json()

              if not telegram_result.get("ok"):
                  print(telegram_result)
                  raise RuntimeError("Telegram rejected the notification")

              print("Telegram notification sent successfully")
              notification_date_to_save = notification_date

          else:
              print("No new Warzone update")
              notification_date_to_save = old_notification_date

          if not notification_date_to_save:
              notification_date_to_save = ""

          new_state = {
              "version": version,
              "import_date": import_date,
              "size": str(raw_size or ""),
              "firmware": firmware,
              "notification_date": notification_date_to_save
          }

          write_file(
              STATE_FILE,
              json.dumps(
                  new_state,
                  ensure_ascii=False,
                  indent=2
              )
          )

          date_for_latest = (
              notification_date_to_save
              if notification_date_to_save
              else "هنوز اعلانی ارسال نشده"
          )

          latest_text = (
              "🎮 WARZONE PS5\n\n"
              f"Version: {version}\n"
              f"Size: {size}\n"
              f"Required Firmware: {firmware}\n"
              f"Patch Added: {import_date}\n"
              f"Last Notification Date: {date_for_latest}\n"
          )

          write_file(LATEST_FILE, latest_text)

          print()
          print("Updating repository state...")

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )

          subprocess.run(
              [
                  "git", "config", "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", STATE_FILE, LATEST_FILE],
              check=True
          )

          changed = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if changed.returncode != 0:
              subprocess.run(
                  ["git", "commit", "-m", "Update Warzone tracker"],
                  check=True
              )

              pushed = False

              for attempt in range(3):
                  push = subprocess.run(
                      ["git", "push", "origin", "main"]
                  )

                  if push.returncode == 0:
                      pushed = True
                      print("Tracker files pushed successfully")
                      break

                  print(
                      f"Push failed. Attempt {attempt + 1}/3"
                  )

                  subprocess.run(
                      ["git", "fetch", "origin", "main"],
                      check=True
                  )

                  subprocess.run(
                      ["git", "rebase", "origin/main"],
                      check=True
                  )

                  time.sleep(2)

              if not pushed:
                  raise RuntimeError(
                      "Git push failed after 3 attempts"
                  )

          else:
              print("No repository changes")

          print("Warzone tracker finished")
          PY
