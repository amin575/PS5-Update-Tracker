name: Warzone API Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Test Prospero loadpatches API
        run: |
          python - <<'PY'
          import requests
          import re
          import html

          URL = "https://prosperopatches.com/PPSA07950"

          print("🎮 Warzone PS5")
          print("Opening Prospero page...")
          print()

          r = requests.get(
              URL,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("HTTP:", r.status_code)
          print("Page size:", len(r.text))
          print()

          if r.status_code != 200:
              print("❌ Page could not be loaded")
              raise SystemExit(1)

          page = html.unescape(r.text)

          print("===== SEARCHING TITLE DATA =====")

          patterns = [
              r'data-titleid=["\']([^"\']+)',
              r'data-key=["\']([^"\']+)',
              r'data-contentver=["\']([^"\']+)',
              r'data-title=["\']([^"\']+)'
          ]

          values = {}

          for pattern in patterns:
              matches = re.findall(
                  pattern,
                  page,
                  re.IGNORECASE
              )

              print()
              print("PATTERN:", pattern)

              if matches:
                  for value in matches[:20]:
                      print(value)
              else:
                  print("NOT FOUND")

          print()
          print("===== SEARCHING AROUND data-titleid =====")

          for match in re.finditer(
              r'data-titleid',
              page,
              re.IGNORECASE
          ):
              pos = match.start()
              print(page[max(0, pos - 500):pos + 2000])
              print()
              break

          print()
          print("===== TEST FINISHED =====")
          PY
