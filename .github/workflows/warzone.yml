name: Warzone Update Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Warzone PS5
        run: |
          python - <<'PY'
          import requests
          import re
          import json

          title_id = "PPSA07950"
          url = f"https://prosperopatches.com/{title_id}"

          print("🎮 Call of Duty: Warzone")
          print("Title ID:", title_id)
          print("Source:", url)
          print()

          r = requests.get(
              url,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("HTTP:", r.status_code)
          print("Page size:", len(r.text))
          print()

          if r.status_code != 200:
              print("❌ Failed to access ProsperoPatches")
              raise SystemExit(1)

          html = r.text

          print("===== SEARCHING PAGE =====")

          patterns = [
              r'Patch\s+([0-9.]+)',
              r'Version\s*:?\s*([0-9.]+)',
              r'([0-9.]+)\s*GB',
              r'([0-9.]+)\s*MB',
              r'PPSA07950'
          ]

          found = False

          for pattern in patterns:
              matches = re.findall(
                  pattern,
                  html,
                  re.IGNORECASE
              )

              if matches:
                  print("Pattern:", pattern)
                  print("Matches:", matches[:20])
                  print()
                  found = True

          if not found:
              print("❌ No version/size data found in initial HTML.")
              print()
              print("This may mean Prospero loads the patch list dynamically.")

              print()
              print("===== RELEVANT HTML =====")

              for keyword in [
                  "PPSA07950",
                  "patch",
                  "version",
                  "json",
                  "api"
              ]:
                  pos = html.lower().find(keyword.lower())

                  if pos != -1:
                      print()
                      print("Keyword:", keyword)
                      print(html[max(0, pos - 300):pos + 1000])

          print()
          print("===== TEST FINISHED =====")
          PY
